<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Abyss — 3D Curved Gallery</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #030305; cursor: grab; }
    body.is-dragging { cursor: grabbing; }
    #canvas { position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; display: block; }
  </style>
</head>
<body>
  <canvas id="canvas"></canvas>

  <script type="module">
    import * as THREE from '/three.module.min.js';

    const canvas = document.getElementById('canvas');
    const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, powerPreference: 'high-performance' });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setClearColor(0x030305, 1);

    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(54, window.innerWidth / window.innerHeight, 0.1, 100);
    camera.position.set(0, 0, 12.8);
    camera.lookAt(0, 0, 0);

    const CELL_SIZE = 3.45, CARD_SIZE = 2.55, COLS = 16, ROWS = 12;
    const TOTAL_W = COLS * CELL_SIZE, TOTAL_H = ROWS * CELL_SIZE;
    const RADIUS_X = 14.0, RADIUS_Y = 7.0;

    const mediaDef = [
      { file: 'img-01.webp', type: 'image', aspect: 0.709 }, { file: 'video-01.mp4', type: 'video', aspect: 1.778 },
      { file: 'img-02.webp', type: 'image', aspect: 0.8 },   { file: 'video-02.mp4', type: 'video', aspect: 1.0 },
      { file: 'img-03.webp', type: 'image', aspect: 0.8 },   { file: 'video-03.mp4', type: 'video', aspect: 0.562 },
      { file: 'img-04.webp', type: 'image', aspect: 0.562 }, { file: 'video-04.mp4', type: 'video', aspect: 1.777 },
      { file: 'img-05.webp', type: 'image', aspect: 0.835 }, { file: 'video-05.mp4', type: 'video', aspect: 0.8 },
      { file: 'img-06.webp', type: 'image', aspect: 0.743 }, { file: 'video-06.mp4', type: 'video', aspect: 1.333 },
      { file: 'img-07.webp', type: 'image', aspect: 0.666 }, { file: 'video-07.mp4', type: 'video', aspect: 1.589 },
      { file: 'video-13.mp4', type: 'video', aspect: 1.859 }, { file: 'video-08.mp4', type: 'video', aspect: 0.562 },
      { file: 'img-09.webp', type: 'image', aspect: 0.876 }, { file: 'video-09.mp4', type: 'video', aspect: 1.322 },
      { file: 'img-10.webp', type: 'image', aspect: 0.77 },  { file: 'video-10.mp4', type: 'video', aspect: 1.394 },
      { file: 'img-11.webp', type: 'image', aspect: 0.8 },   { file: 'video-11.mp4', type: 'video', aspect: 1.772 },
      { file: 'img-12.webp', type: 'image', aspect: 1.184 }, { file: 'video-12.mp4', type: 'video', aspect: 1.0 }
    ];

    const textureLoader = new THREE.TextureLoader();
    const videoElements = [];

    const mediaPool = mediaDef.map(item => {
      const cardW = item.aspect >= 1.0 ? CARD_SIZE : CARD_SIZE * item.aspect;
      const cardH = item.aspect >= 1.0 ? CARD_SIZE / item.aspect : CARD_SIZE;
      const geom = new THREE.PlaneGeometry(cardW, cardH, 12, 12);
      const path = `/images/components/cyclorama-matrix/${item.file}`;

      let texture;
      if (item.type === 'video') {
        const vid = document.createElement('video');
        vid.src = path;
        vid.crossOrigin = 'anonymous';
        vid.loop = vid.muted = vid.playsInline = vid.autoplay = true;
        vid.setAttribute('webkit-playsinline', 'true');
        vid.play().catch(() => {});
        videoElements.push(vid);
        texture = new THREE.VideoTexture(vid);
        texture.minFilter = texture.magFilter = THREE.LinearFilter;
      } else {
        texture = textureLoader.load(path);
        texture.generateMipmaps = true;
        texture.minFilter = THREE.LinearMipmapLinearFilter;
      }
      return { geom, texture, aspect: item.aspect };
    });

    const resumeVideos = () => videoElements.forEach(v => v.paused && v.play().catch(() => {}));
    ['pointerdown', 'touchstart'].forEach(e => window.addEventListener(e, resumeVideos, { once: true }));

    // Unified GPU Amphitheater Curve Formulation
    const curveGlsl = `
      vec3 getCurvedPos(vec2 worldPos, float zOffset) {
        float theta = worldPos.x / uRadiusX;
        float phi = worldPos.y / uRadiusY;
        float curvedX = sin(theta) * uRadiusX;
        float curvedY = sin(phi) * uRadiusY;
        float rSq = theta * theta + phi * phi;
        float curvedZ = uRadiusX * (1.0 - cos(theta)) + uRadiusY * (1.0 - cos(phi)) + rSq * 1.1 + zOffset;
        return vec3(curvedX, curvedY, curvedZ);
      }
    `;

    const createSharedVertShader = (zOffset) => `
      uniform vec2 uCellCenter;
      uniform float uRadiusX;
      uniform float uRadiusY;
      varying vec2 vUv;
      varying vec3 vCurvedPos;
      ${curveGlsl}
      void main() {
        vUv = uv;
        vec3 p = getCurvedPos(uCellCenter + position.xy, ${zOffset});
        vCurvedPos = p;
        gl_Position = projectionMatrix * viewMatrix * vec4(p, 1.0);
      }
    `;

    const cardVert = createSharedVertShader('0.04');
    const bgVert = createSharedVertShader('-0.05');
    const labelVert = createSharedVertShader('0.06');

    const cardFrag = `
      uniform sampler2D uTexture;
      uniform float uCamZ;
      varying vec2 vUv;
      varying vec3 vCurvedPos;
      void main() {
        // Optical Rack-Focus Arrival & Perimeter Depth Blur (Dynamic Zoom-Scaled)
        float holdT = clamp((uCamZ - 12.8) / 4.2, 0.0, 1.0);
        float radX = mix(12.0, 14.8, holdT);
        float radY = mix(6.0, 7.6, holdT);
        float rad = length(vec2(abs(vCurvedPos.x) / radX, abs(vCurvedPos.y) / radY));
        float edgeFade = 1.0 - smoothstep(mix(0.60, 0.62, holdT), mix(1.12, 1.08, holdT), rad);
        float blur = smoothstep(mix(0.50, 0.55, holdT), mix(1.10, 1.08, holdT), rad) * 0.007;

        vec4 col = texture2D(uTexture, vUv) * 0.36;
        col += texture2D(uTexture, vUv + vec2( blur,  0.0)) * 0.16;
        col += texture2D(uTexture, vUv - vec2( blur,  0.0)) * 0.16;
        col += texture2D(uTexture, vUv + vec2( 0.0,  blur)) * 0.16;
        col += texture2D(uTexture, vUv - vec2( 0.0,  blur)) * 0.16;

        gl_FragColor = vec4(col.rgb * edgeFade, col.a * edgeFade);
      }
    `;

    const bgFrag = `
      uniform sampler2D uTexture;
      uniform float uHover;
      uniform float uAspect;
      uniform float uCamZ;
      varying vec2 vUv;
      varying vec3 vCurvedPos;
      void main() {
        // Perimeter Optical Fog (Dynamic Zoom-Scaled)
        float holdT = clamp((uCamZ - 12.8) / 4.2, 0.0, 1.0);
        float radX = mix(12.0, 14.8, holdT);
        float radY = mix(6.0, 7.6, holdT);
        float rad = length(vec2(abs(vCurvedPos.x) / radX, abs(vCurvedPos.y) / radY));
        float edgeFade = 1.0 - smoothstep(mix(0.60, 0.62, holdT), mix(1.12, 1.08, holdT), rad);

        vec2 edge = abs(vUv - 0.5) * 2.0;
        float maxEdge = max(edge.x, edge.y);

        // Anti-aliased 1.2px sub-pixel vector hairline
        float dist = 1.0 - maxEdge;
        float fw = max(fwidth(dist), 0.0008);
        float border = smoothstep(fw * 1.3, fw * 0.1, dist);

        // Crisp stark white hairline
        vec3 borderCol = vec3(0.96, 0.98, 1.0);

        // Deep optical obsidian interior with contact ambient shadow beneath media
        vec3 glassCol = vec3(0.010, 0.011, 0.014);

        // Physical Contact Shadow grounding the foreground card
        vec2 mHalf = vec2(
          (uAspect >= 1.0 ? 2.55 : 2.55 * uAspect) / 3.22 * 0.5,
          (uAspect >= 1.0 ? 2.55 / uAspect : 2.55) / 3.22 * 0.5
        );
        vec2 dBox = max(abs(vUv - 0.5) - mHalf, 0.0);
        float contactShadow = 1.0 - smoothstep(0.0, 0.09, length(dBox)) * 0.65;
        glassCol *= contactShadow;

        // Ambient Frosted Media on Hover
        float t = clamp(uHover, 0.0, 1.0);
        float fade = pow(t, 1.7);

        vec2 uv = vUv - 0.5;
        if (uAspect > 1.0) uv.x /= uAspect; else uv.y *= uAspect;
        vec2 cUv = clamp(uv + 0.5, 0.005, 0.995);

        vec3 col = texture2D(uTexture, cUv).rgb * 0.28;
        const float o = 0.012;
        col += (texture2D(uTexture, cUv + vec2(o, 0.0)).rgb + texture2D(uTexture, cUv - vec2(o, 0.0)).rgb +
                texture2D(uTexture, cUv + vec2(0.0, o)).rgb + texture2D(uTexture, cUv - vec2(0.0, o)).rgb) * 0.12;
        col += (texture2D(uTexture, cUv + vec2(o, o) * 0.707).rgb + texture2D(uTexture, cUv + vec2(-o, o) * 0.707).rgb +
                texture2D(uTexture, cUv + vec2(o, -o) * 0.707).rgb + texture2D(uTexture, cUv - vec2(o, -o) * 0.707).rgb) * 0.06;

        vec3 grad = mix(
          mix(texture2D(uTexture, vec2(0.20, 0.20)).rgb, texture2D(uTexture, vec2(0.80, 0.20)).rgb, vUv.x),
          mix(texture2D(uTexture, vec2(0.20, 0.80)).rgb, texture2D(uTexture, vec2(0.80, 0.80)).rgb, vUv.x),
          vUv.y
        );
        col = mix(col, grad, 0.40);
        float centerDist = length(vUv - 0.5) * 1.414;
        col = mix(col, vec3(0.02, 0.025, 0.04), 0.22) * (1.0 - smoothstep(0.5, 1.15, centerDist) * 0.30);

        // Blend: deep obsidian plate + hover media bloom
        vec3 finalCol = mix(glassCol, col, fade * 0.92);

        // Sophisticated dimmed architectural hairline
        float borderAlpha = border * mix(0.28, 0.85, fade);
        finalCol = mix(finalCol, borderCol, borderAlpha);

        // Soft perimeter optical falloff
        finalCol *= edgeFade;

        gl_FragColor = vec4(finalCol, 0.96 * edgeFade);
      }
    `;

    const labelFrag = `
      uniform sampler2D uTexture;
      uniform float uHover;
      uniform float uCamZ;
      varying vec2 vUv;
      varying vec3 vCurvedPos;
      void main() {
        float holdT = clamp((uCamZ - 12.8) / 4.2, 0.0, 1.0);
        float radX = mix(12.0, 14.8, holdT);
        float radY = mix(6.0, 7.6, holdT);
        float rad = length(vec2(abs(vCurvedPos.x) / radX, abs(vCurvedPos.y) / radY));
        float edgeFade = 1.0 - smoothstep(mix(0.60, 0.62, holdT), mix(1.12, 1.08, holdT), rad);

        vec4 col = texture2D(uTexture, vUv);
        if (col.a <= 0.005) discard;
        float alpha = col.a * mix(0.74, 1.0, pow(clamp(uHover, 0.0, 1.0), 1.5)) * edgeFade;
        gl_FragColor = vec4(col.rgb * edgeFade, alpha);
      }
    `;

    const FRAME_SIZE = 3.22;
    const bgGeom = new THREE.PlaneGeometry(FRAME_SIZE, FRAME_SIZE, 12, 12);
    const bgGroup = new THREE.Group(), cardGroup = new THREE.Group(), labelGroup = new THREE.Group();
    scene.add(bgGroup, cardGroup, labelGroup);

    const assetMeta = [
      { title: 'RODEO SILHOUETTE', pill: 'WESTERN' }, { title: 'SPIDER-MAN', pill: 'MARVEL' },
      { title: 'STAGE CONCERT', pill: 'LIVE' },       { title: 'MECHA ROBOT', pill: 'ANIME' },
      { title: 'MICHAEL JORDAN', pill: 'BULLS 23' },  { title: 'LIONEL MESSI', pill: 'UCL 2009' },
      { title: 'KOBE BRYANT', pill: 'NBA CLASSIC' },  { title: 'OUT OF CITY', pill: 'EDITORIAL' },
      { title: 'BATMAN TAS', pill: 'GOTHAM' },        { title: 'POINT CLOUD', pill: '3D SCAN' },
      { title: 'SIMON BAKER', pill: 'PORTRAIT' },    { title: 'PORSCHE 911', pill: 'NIGHT RUNNER' },
      { title: 'C. RONALDO', pill: 'REAL MADRID' },   { title: 'SHADOW INK', pill: 'ANIMATION' },
      { title: 'CIGARETTE', pill: 'ANALOG LOOP' },    { title: 'KOBE BRYANT', pill: 'LAKERS' },
      { title: 'TUPAC SHAKUR', pill: 'DEATH ROW' },   { title: 'DOODLE ART', pill: 'SKETCH' },
      { title: 'DON TOLIVER', pill: 'HARDSTONE' },    { title: 'AIR MAX PLUS', pill: 'NIKE TN' },
      { title: 'TRAVIS SCOTT', pill: 'UTOPIA' },      { title: 'BEAST RIDER', pill: 'FANTASY' },
      { title: 'ICHIGO KUROSAKI', pill: 'BLEACH' },   { title: 'CHROME SCULPTURE', pill: '3D ART' }
    ];

    const maxAniso = renderer.capabilities.getMaxAnisotropy();
    const labelTextures = assetMeta.map(meta => {
      const c = document.createElement('canvas');
      c.width = c.height = 512;
      const ctx = c.getContext('2d');

      ctx.fillStyle = 'rgba(255, 255, 255, 0.96)';
      ctx.font = '800 16px -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif';
      ctx.fillText(meta.title, 26, 40);

      ctx.font = '700 11px -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif';
      const pillW = ctx.measureText(meta.pill).width + 20;
      const pillH = 23, pillX = 512 - 26 - pillW, pillY = 512 - 44;

      ctx.beginPath();
      ctx.roundRect(pillX, pillY, pillW, pillH, 11.5);
      ctx.fillStyle = 'rgba(12, 14, 20, 0.76)';
      ctx.fill();
      ctx.lineWidth = 1.0;
      ctx.strokeStyle = 'rgba(255, 255, 255, 0.32)';
      ctx.stroke();

      ctx.fillStyle = 'rgba(255, 255, 255, 0.94)';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(meta.pill, pillX + pillW / 2, pillY + pillH / 2 + 0.5);

      const tex = new THREE.CanvasTexture(c);
      tex.generateMipmaps = true;
      tex.minFilter = THREE.LinearMipmapLinearFilter;
      tex.magFilter = THREE.LinearFilter;
      tex.anisotropy = maxAniso;
      return tex;
    });

    const cards = [];
    let cardLagX = 0, cardLagY = 0;

    const SEED_ORDER = [
      14, 3, 22, 7, 18, 1, 11, 20,
      9, 16, 5, 23, 12, 2, 19, 8,
      21, 4, 15, 10, 17, 0, 13, 6
    ];

    const camZUniform = { value: 12.8 };

    for (let c = 0; c < COLS; c++) {
      for (let r = 0; r < ROWS; r++) {
        const rowTier = ((r % 3) + 3) % 3;
        const colShift = (c + Math.floor(r / 3) * 3) % 8;
        const mediaIndex = SEED_ORDER[rowTier * 8 + colShift];
        const media = mediaPool[mediaIndex];

        const bgMat = new THREE.ShaderMaterial({
          vertexShader: bgVert,
          fragmentShader: bgFrag,
          uniforms: {
            uTexture: { value: media.texture },
            uCellCenter: { value: new THREE.Vector2() },
            uRadiusX: { value: RADIUS_X },
            uRadiusY: { value: RADIUS_Y },
            uHover: { value: 0.0 },
            uAspect: { value: media.aspect },
            uCamZ: camZUniform
          },
          transparent: true, depthWrite: false, side: THREE.FrontSide
        });
        const bgMesh = new THREE.Mesh(bgGeom, bgMat);
        bgMesh.renderOrder = 1;
        bgGroup.add(bgMesh);

        const mat = new THREE.ShaderMaterial({
          vertexShader: cardVert,
          fragmentShader: cardFrag,
          uniforms: {
            uTexture: { value: media.texture },
            uCellCenter: { value: new THREE.Vector2() },
            uRadiusX: { value: RADIUS_X },
            uRadiusY: { value: RADIUS_Y },
            uHover: { value: 0.0 },
            uCamZ: camZUniform
          },
          transparent: true, depthWrite: false, side: THREE.FrontSide
        });
        const mesh = new THREE.Mesh(media.geom, mat);
        mesh.renderOrder = 2;
        cardGroup.add(mesh);

        const labelMat = new THREE.ShaderMaterial({
          vertexShader: labelVert,
          fragmentShader: labelFrag,
          uniforms: {
            uTexture: { value: labelTextures[mediaIndex] },
            uCellCenter: { value: new THREE.Vector2() },
            uRadiusX: { value: RADIUS_X },
            uRadiusY: { value: RADIUS_Y },
            uHover: { value: 0.0 },
            uCamZ: camZUniform
          },
          transparent: true, depthWrite: false, side: THREE.FrontSide
        });
        const labelMesh = new THREE.Mesh(bgGeom, labelMat);
        labelMesh.renderOrder = 4;
        labelGroup.add(labelMesh);

        cards.push({
          mat, bgMat, labelMat,
          mediaIndex,
          baseX: (c - COLS / 2) * CELL_SIZE,
          baseY: (r - ROWS / 2) * CELL_SIZE,
          currentHover: 0.0
        });
      }
    }



    // Frame-Rate Independent Drag & Wheel Physics
    let targetPanX = 0, targetPanY = 0, panX = 0, panY = 0;
    let velX = 0, velY = 0;
    let isDragging = false, lastClientX = 0, lastClientY = 0;

    const FRICTION_PER_SEC = 4.8; // Frame-rate independent decay constant

    window.addEventListener('pointerdown', (e) => {
      isDragging = true;
      document.body.classList.add('is-dragging');
      lastClientX = e.clientX;
      lastClientY = e.clientY;
    });

    let mouseX = -9999, mouseY = -9999, hasMouse = false;

    window.addEventListener('pointermove', (e) => {
      mouseX = e.clientX;
      mouseY = e.clientY;
      hasMouse = true;

      if (!isDragging) return;
      const moveX = e.clientX - lastClientX;
      const moveY = e.clientY - lastClientY;
      lastClientX = e.clientX;
      lastClientY = e.clientY;
      targetPanX += moveX * 0.0078;
      targetPanY -= moveY * 0.0078;
    });

    window.addEventListener('pointerleave', () => { hasMouse = false; });
    const stopDrag = () => {
      if (!isDragging) return;
      isDragging = false;
      document.body.classList.remove('is-dragging');
    };
    window.addEventListener('pointerup', stopDrag);
    window.addEventListener('pointercancel', stopDrag);

    window.addEventListener('wheel', (e) => {
      e.preventDefault();
      let dx = e.deltaX, dy = e.deltaY;
      if (e.deltaMode === 1) { dx *= 18; dy *= 18; }
      else if (e.deltaMode === 2) { dx *= 80; dy *= 80; }

      const wheelSens = 0.0032;
      targetPanX -= dx * wheelSens;
      targetPanY += dy * wheelSens;

      // Frame-rate neutral velocity impulse
      velX = velX * 0.5 - (dx * wheelSens * 33.0);
      velY = velY * 0.5 + (dy * wheelSens * 33.0);
    }, { passive: false });

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    const BASE_CAM_Z = 12.8, ZOOM_OUT_CAM_Z = 17.0;
    let currentCamZ = BASE_CAM_Z, camZVel = 0;
    const SPRING_K = 190.0, SPRING_D = 27.5;

    function projectPoint(x, y) {
      const theta = x / RADIUS_X, phi = y / RADIUS_Y;
      return [
        Math.sin(theta) * RADIUS_X,
        Math.sin(phi) * RADIUS_Y,
        RADIUS_X * (1.0 - Math.cos(theta)) + RADIUS_Y * (1.0 - Math.cos(phi)) + (theta * theta + phi * phi) * 1.1
      ];
    }

    const projVec = new THREE.Vector3();
    let lastFrame = performance.now();

    function animate() {
      requestAnimationFrame(animate);

      const now = performance.now();
      const dtSec = Math.min(0.033, Math.max(0.001, (now - lastFrame) / 1000));
      lastFrame = now;

      // Spring Zoom with Semi-Implicit Euler
      const targetCamZ = isDragging ? ZOOM_OUT_CAM_Z : BASE_CAM_Z;
      const springAcc = (targetCamZ - currentCamZ) * SPRING_K - camZVel * SPRING_D;
      camZVel += springAcc * dtSec;
      currentCamZ += camZVel * dtSec;
      camera.position.z = currentCamZ;
      camZUniform.value = currentCamZ;

      // Frame-Rate Independent Liquid Drag & Momentum (60Hz, 120Hz, 144Hz, 240Hz parity)
      if (isDragging) {
        const followRate = 1.0 - Math.exp(-22.0 * dtSec);
        const prevPanX = panX, prevPanY = panY;
        panX += (targetPanX - panX) * followRate;
        panY += (targetPanY - panY) * followRate;

        // Velocity in units/sec with time-constant exponential smoothing
        const instVelX = (panX - prevPanX) / dtSec;
        const instVelY = (panY - prevPanY) / dtSec;
        const velBlend = 1.0 - Math.exp(-18.0 * dtSec);
        velX += (instVelX - velX) * velBlend;
        velY += (instVelY - velY) * velBlend;
      } else {
        targetPanX += velX * dtSec;
        targetPanY += velY * dtSec;
        const followRate = 1.0 - Math.exp(-24.0 * dtSec);
        panX += (targetPanX - panX) * followRate;
        panY += (targetPanY - panY) * followRate;

        const decay = Math.exp(-FRICTION_PER_SEC * dtSec);
        velX *= decay;
        velY *= decay;
        if (Math.abs(velX) < 0.001) velX = 0;
        if (Math.abs(velY) < 0.001) velY = 0;
      }

      // Parallax Lag (Frame-rate corrected)
      let hoverCardX = 0, hoverCardY = 0;
      if (hasMouse && !isDragging) {
        const nx = (mouseX / window.innerWidth - 0.5) * 2.0;
        const ny = (mouseY / window.innerHeight - 0.5) * 2.0;
        hoverCardX = -nx * 0.08;
        hoverCardY = ny * 0.08;
      }
      const targetLagX = Math.max(-0.24, Math.min(0.24, -velX * 0.026 + hoverCardX));
      const targetLagY = Math.max(-0.24, Math.min(0.24, -velY * 0.026 + hoverCardY));
      const lagBlend = 1.0 - Math.exp(-9.0 * dtSec);
      cardLagX += (targetLagX - cardLagX) * lagBlend;
      cardLagY += (targetLagY - cardLagY) * lagBlend;

      // Screen-Space Hit Detection (Culling culled/backside cards for speed)
      let hoveredCard = null;
      if (hasMouse && !isDragging) {
        const tanHalfFov = Math.tan((camera.fov * Math.PI) / 360);
        let closestDist = Infinity;

        for (let i = 0; i < cards.length; i++) {
          const card = cards[i];
          let x = ((card.baseX + panX) % TOTAL_W + TOTAL_W) % TOTAL_W - TOTAL_W / 2;
          let y = ((card.baseY + panY) % TOTAL_H + TOTAL_H) % TOTAL_H - TOTAL_H / 2;

          // Frustum/Curvature Cull: skip cards well outside viewport
          if (Math.abs(x) > 13.0 || Math.abs(y) > 9.0) continue;

          const p = projectPoint(x + cardLagX, y + cardLagY);
          projVec.set(p[0], p[1], p[2]).project(camera);
          if (projVec.z < -1.0 || projVec.z > 1.0) continue;

          const screenX = (projVec.x * 0.5 + 0.5) * window.innerWidth;
          const screenY = (-projVec.y * 0.5 + 0.5) * window.innerHeight;
          const dX = Math.abs(mouseX - screenX), dY = Math.abs(mouseY - screenY);

          const depthDist = Math.max(0.1, currentCamZ - p[2]);
          const cellScreen = ((window.innerHeight * 0.5) / (tanHalfFov * depthDist)) * CELL_SIZE;

          if (dX <= cellScreen * 0.50 && dY <= cellScreen * 0.50) {
            const d = dX * dX + dY * dY;
            if (d < closestDist) {
              closestDist = d;
              hoveredCard = card;
            }
          }
        }
      }

      // Smooth Hover Bloom & Uniform Updates
      cards.forEach(card => {
        let x = ((card.baseX + panX) % TOTAL_W + TOTAL_W) % TOTAL_W - TOTAL_W / 2;
        let y = ((card.baseY + panY) % TOTAL_H + TOTAL_H) % TOTAL_H - TOTAL_H / 2;

        const targetHover = (card === hoveredCard) ? 1.0 : 0.0;
        const rate = (targetHover > card.currentHover) ? 2.4 : 5.0;
        card.currentHover += (targetHover - card.currentHover) * (1.0 - Math.exp(-rate * dtSec));
        if (card.currentHover < 0.0005) card.currentHover = 0.0;

        card.mat.uniforms.uCellCenter.value.set(x + cardLagX, y + cardLagY);
        card.mat.uniforms.uHover.value = card.currentHover;

        card.bgMat.uniforms.uCellCenter.value.set(x + cardLagX * 0.35, y + cardLagY * 0.35);
        card.bgMat.uniforms.uHover.value = card.currentHover;

        card.labelMat.uniforms.uCellCenter.value.set(x, y);
        card.labelMat.uniforms.uHover.value = card.currentHover;
      });



      renderer.render(scene, camera);
    }

    animate();
  </script>
</body>
</html>
