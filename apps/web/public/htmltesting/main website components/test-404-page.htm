<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 — Abyss</title>
  
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link href="https://api.fontshare.com/v2/css?f[]=switzer@400,500,600&f[]=ranade@600,700&display=swap" rel="stylesheet">

  <!-- Local Saint Regus Font -->
  <style>
    @font-face {
      font-family: 'Saint Regus';
      src: url('/fonts/saint-regus/sonar-hubermann-saintregus-semibold.otf') format('opentype');
      font-weight: 600;
      font-style: normal;
      font-display: swap;
    }

    @font-face {
      font-family: 'Saint Regus Expanded';
      src: url('/fonts/saint-regus/sonar-hubermann-saintregus-semiboldexpanded.otf') format('opentype');
      font-weight: 600;
      font-style: normal;
      font-display: swap;
    }

    :root {
      --bg: #0d0d0f;
      --accent: #9be5fb;
      --text-white: #ededee;
      --text-muted: #8e8e93;
      --text-dim: #52525b;
      --font-display: 'Saint Regus', 'Saint Regus Expanded', serif;
      --font-body: 'Switzer', -apple-system, sans-serif;
      --font-mono: 'JetBrains Mono', monospace;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    ::selection {
      background: #9be5fb !important;
      color: #09090b !important;
    }

    body {
      background-color: var(--bg);
      color: var(--text-white);
      font-family: var(--font-body);
      min-height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    /* Mock Floating Dock Navbar */
    .dock-wrapper {
      position: fixed;
      top: 24px;
      left: 0;
      width: 100%;
      display: flex;
      justify-content: center;
      z-index: 50;
      pointer-events: none;
    }

    .dock-nav {
      pointer-events: auto;
      display: inline-flex;
      align-items: center;
      gap: 28px;
      padding: 8px 18px;
      background: linear-gradient(180deg, rgba(20, 20, 22, 0.85) 0%, rgba(13, 13, 15, 0.85) 100%);
      backdrop-filter: blur(20px) saturate(180%);
      -webkit-backdrop-filter: blur(20px) saturate(180%);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 9999px;
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.1),
        inset 0 -1px 0 rgba(0, 0, 0, 0.5),
        0 16px 36px rgba(0, 0, 0, 0.7);
    }

    .dock-logo {
      display: flex;
      align-items: center;
      gap: 8px;
      font-family: var(--font-mono);
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.12em;
      color: #ffffff;
      text-decoration: none;
    }

    .dock-logo-star {
      color: var(--accent);
      font-size: 15px;
    }

    .dock-links {
      display: flex;
      align-items: center;
      gap: 20px;
    }

    .dock-link {
      font-family: var(--font-body);
      font-size: 13px;
      color: var(--text-muted);
      text-decoration: none;
      transition: color 150ms ease;
    }

    .dock-link:hover {
      color: #ffffff;
    }

    /* Central Editorial Content */
    .hero-content {
      position: relative;
      z-index: 10;
      text-align: center;
      max-width: 720px;
      padding: 0 24px;
      margin-top: -60px;
    }

    .tag-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-family: var(--font-mono);
      font-size: 12px;
      font-weight: 500;
      letter-spacing: 0.14em;
      color: var(--text-muted);
      text-transform: uppercase;
      margin-bottom: 24px;
    }

    .tag-badge span.accent {
      color: var(--accent);
    }

    /* Giant 404 Headline in Saint Regus */
    .hero-title {
      font-family: var(--font-display);
      font-size: clamp(72px, 12vw, 130px);
      font-weight: 600;
      line-height: 0.95;
      letter-spacing: 0.02em;
      color: #ffffff;
      margin-bottom: 24px;
      text-shadow: 0 10px 40px rgba(0, 0, 0, 0.8);
    }

    .hero-desc {
      font-family: var(--font-body);
      font-size: 18px;
      line-height: 1.6;
      color: var(--text-muted);
      max-width: 480px;
      margin: 0 auto 36px auto;
      letter-spacing: -0.015em;
    }

    .hero-actions {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 32px;
    }

    .link-btn {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-family: var(--font-mono);
      font-size: 13.5px;
      font-weight: 450;
      color: var(--accent);
      text-decoration: none;
      position: relative;
      padding-bottom: 3px;
      cursor: pointer;
    }

    .link-btn .line {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      height: 1.5px;
      background: var(--accent);
      border-radius: 1px;
      transform: scaleX(0);
      transform-origin: left;
      transition: transform 600ms cubic-bezier(0.22, 1, 0.36, 1);
    }

    .link-btn:hover .line {
      transform: scaleX(1);
    }

    .link-btn .arrow {
      display: inline-flex;
      align-items: center;
      transition: transform 250ms cubic-bezier(0.16, 1, 0.3, 1);
    }

    .link-btn:hover .arrow {
      transform: translate(2.5px, -2.5px);
    }

    .link-btn-secondary {
      font-family: var(--font-mono);
      font-size: 13.5px;
      color: var(--text-muted);
      text-decoration: none;
      transition: color 150ms ease;
    }

    .link-btn-secondary:hover {
      color: #ffffff;
    }

    /* Bottom-Anchored Gravity Horizon Canvas */
    #horizon-canvas {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100vw;
      height: 280px;
      z-index: 2;
      pointer-events: none;
    }

    /* Laser Horizon Glow Line */
    .horizon-line {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 1px;
      background: linear-gradient(90deg, transparent 0%, rgba(155, 229, 251, 0.3) 30%, rgba(155, 229, 251, 0.8) 50%, rgba(155, 229, 251, 0.3) 70%, transparent 100%);
      z-index: 3;
      pointer-events: none;
    }
  </style>
  <!-- Three.js from CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

  <!-- Mock Floating Dock Navbar -->
  <div class="dock-wrapper">
    <nav class="dock-nav">
      <a href="/collection" class="dock-logo">
        <span class="dock-logo-star">✶</span>
        <span>ABYSS</span>
      </a>
      <div class="dock-links">
        <a href="/collection" class="dock-link">Collection</a>
        <a href="/docs" class="dock-link">Docs</a>
        <a href="/changelog" class="dock-link">Changelog</a>
      </div>
    </nav>
  </div>

  <!-- Central Editorial Hero with Saint Regus -->
  <main class="hero-content">
    <div class="tag-badge">
      <span class="accent">[404]</span>
      <span>•</span>
      <span>Void Coordinate</span>
    </div>

    <h1 class="hero-title">
      404
    </h1>

    <p class="hero-desc">
      You stepped off the edge of the catalog. The coordinates you requested collapsed into deep space.
    </p>

    <div class="hero-actions">
      <a href="/collection" class="link-btn">
        <span>Return to Collection</span>
        <span class="arrow">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="7" y1="17" x2="17" y2="7"></line>
            <polyline points="7 7 17 7 17 17"></polyline>
          </svg>
        </span>
        <span class="line"></span>
      </a>

      <a href="/docs" class="link-btn-secondary">
        Documentation ↗
      </a>
    </div>
  </main>

  <!-- Bottom-Anchored Gravity Horizon Canvas -->
  <canvas id="horizon-canvas"></canvas>
  <div class="horizon-line"></div>

  <script>
    // --- 3D BOTTOM-ANCHORED CELESTIAL STAR HORIZON ---
    const canvas = document.getElementById('horizon-canvas');
    let scene, camera, renderer, starMesh, outerRing;
    let mouse = { x: 0, y: 0, targetX: 0, targetY: 0 };

    function initHorizon() {
      const width = window.innerWidth;
      const height = 280;

      scene = new THREE.Scene();
      camera = new THREE.PerspectiveCamera(40, width / height, 0.1, 100);
      camera.position.set(0, 0, 6.5);

      renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
      renderer.setSize(width, height);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

      // Abyss 4-Point Celestial Star Polyhedron
      const starGeom = new THREE.OctahedronGeometry(1.3, 0);
      const starMat = new THREE.MeshBasicMaterial({
        color: 0x9be5fb,
        wireframe: true,
        transparent: true,
        opacity: 0.65
      });
      starMesh = new THREE.Mesh(starGeom, starMat);
      starMesh.position.y = -0.5; // Anchored emerging from bottom horizon
      scene.add(starMesh);

      // Outer Orbital Wireframe Ring
      const ringGeom = new THREE.RingGeometry(1.8, 2.2, 36);
      const ringMat = new THREE.MeshBasicMaterial({
        color: 0xffffff,
        wireframe: true,
        transparent: true,
        opacity: 0.15,
        side: THREE.DoubleSide
      });
      outerRing = new THREE.Mesh(ringGeom, ringMat);
      outerRing.position.y = -0.5;
      outerRing.rotation.x = Math.PI * 0.45;
      scene.add(outerRing);

      window.addEventListener('resize', onResize);
      window.addEventListener('mousemove', (e) => {
        mouse.targetX = (e.clientX / window.innerWidth - 0.5) * 2;
        mouse.targetY = -(e.clientY / window.innerHeight - 0.5) * 2;
      });

      animateHorizon();
    }

    function onResize() {
      const width = window.innerWidth;
      const height = 280;
      camera.aspect = width / height;
      camera.updateProjectionMatrix();
      renderer.setSize(width, height);
    }

    function animateHorizon() {
      requestAnimationFrame(animateHorizon);

      // Smooth mouse lerp
      mouse.x += (mouse.targetX - mouse.x) * 0.05;
      mouse.y += (mouse.targetY - mouse.y) * 0.05;

      if (starMesh) {
        starMesh.rotation.y += 0.008;
        starMesh.rotation.x = 0.2 + mouse.y * 0.2;
        starMesh.rotation.z = mouse.x * 0.2;
      }

      if (outerRing) {
        outerRing.rotation.z -= 0.004;
        outerRing.rotation.x = Math.PI * 0.45 + mouse.y * 0.15;
      }

      renderer.render(scene, camera);
    }

    initHorizon();
  </script>
</body>
</html>
