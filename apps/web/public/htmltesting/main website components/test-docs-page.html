  <script>
    // ─── WebGL Shader Implementation ───
    const container = document.getElementById('canvas-container');
    const scene = new THREE.Scene();
    const camera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false, powerPreference: "high-performance" });
    
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    container.appendChild(renderer.domElement);

    const vertexShader = `
      varying vec2 vUv;
      void main() {
        vUv = uv;
        gl_Position = vec4(position, 1.0);
      }
    `;

    const fragmentShader = `
      uniform float uTime;
      uniform vec2 uResolution;
      uniform vec2 uMouse;
      uniform float uSpeed;
      uniform float uGlow;
      uniform float uScale;
      varying vec2 vUv;

      // Precision Simplex-like Noise
      vec3 mod289(vec3 x) { return x - floor(x * (1.0 / 289.0)) * 289.0; }
      vec2 mod289(vec2 x) { return x - floor(x * (1.0 / 289.0)) * 289.0; }
      vec3 permute(vec3 x) { return mod289(((x*34.0)+1.0)*x); }

      float snoise(vec2 v) {
        const vec4 C = vec4(0.211324865405187, 0.366025403784439,
                           -0.577350269189626, 0.024390243902439);
        vec2 i  = floor(v + dot(v, C.yy));
        vec2 x0 = v -   i + dot(i, C.xx);
        vec2 i1;
        i1 = (x0.x > x0.y) ? vec2(1.0, 0.0) : vec2(0.0, 1.0);
        vec4 x12 = x0.xyxy + C.xxzz;
        x12.xy -= i1;
        i = mod289(i);
        vec3 p = permute(permute(i.y + vec3(0.0, i1.y, 1.0))
              + i.x + vec3(0.0, i1.x, 1.0));
        vec3 m = max(0.5 - vec3(dot(x0,x0), dot(x12.xy,x12.xy), dot(x12.zw,x12.zw)), 0.0);
        m = m*m;
        m = m*m;
        vec3 x = 2.0 * fract(p * C.www) - 1.0;
        vec3 h = abs(x) - 0.5;
        vec3 ox = floor(x + 0.5);
        vec3 a0 = x - ox;
        m *= 1.79284291400159 - 0.85373472095314 * (a0*a0 + h*h);
        vec3 g;
        g.x = a0.x * x0.x + h.x * x0.y;
        g.yz = a0.yz * x12.xz + h.yz * x12.yw;
        return 130.0 * dot(m, g);
      }

      // Domain Warped Fractal Brownian Motion
      float fbm(vec2 p) {
        float f = 0.0;
        float w = 0.5;
        for (int i = 0; i < 4; i++) {
          f += w * snoise(p);
          p *= 2.02;
          w *= 0.5;
        }
        return f;
      }

      // Dithering to eliminate 8-bit color banding
      float randomDither(vec2 uv) {
        return fract(sin(dot(uv, vec2(12.9898, 78.233))) * 43758.5453);
      }

      void main() {
        vec2 st = (gl_FragCoord.xy - 0.5 * uResolution.xy) / min(uResolution.x, uResolution.y);
        st *= uScale;

        float t = uTime * uSpeed;

        // Domain warping coordinates
        vec2 q = vec2(
          fbm(st + vec2(0.0, t * 0.2)),
          fbm(st + vec2(5.2, t * 0.13))
        );

        vec2 r = vec2(
          fbm(st + 4.0 * q + vec2(1.7, 9.2 + t * 0.15)),
          fbm(st + 4.0 * q + vec2(8.3, 2.8 + t * 0.12))
        );

        float f = fbm(st + 4.0 * r);

        // Color Palettes
        // Base Void: #0d0d0f (13, 13, 15)
        vec3 colBase = vec3(0.051, 0.051, 0.059);
        
        // Deep Glacial Trench: #0a131c
        vec3 colDeepGlacier = vec3(0.039, 0.075, 0.110);
        
        // Ethereal Ice Blue / Frost Accent: #9be5fb (155, 229, 251)
        vec3 colIceBlue = vec3(0.608, 0.898, 0.984);

        // Frost Mist White
        vec3 colFrostMist = vec3(0.85, 0.95, 1.0);

        // Mix layers
        vec3 color = mix(colBase, colDeepGlacier, clamp((f*f)*4.0, 0.0, 1.0));
        
        // Add subtle ice blue highlights along ridges
        float ridge = smoothstep(0.1, 0.9, length(q));
        color = mix(color, colIceBlue, clamp(length(r) * ridge * uGlow, 0.0, 0.85));

        // Add soft specular frost crest
        float crest = pow(clamp(f * 1.2, 0.0, 1.0), 3.0) * uGlow * 0.6;
        color += colFrostMist * crest;

        // Hardware dither pass
        color += (randomDither(vUv) - 0.5) * 0.012;

        gl_FragColor = vec4(color, 1.0);
      }
    `;

    const uniforms = {
      uTime: { value: 0 },
      uResolution: { value: new THREE.Vector2(window.innerWidth, window.innerHeight) },
      uMouse: { value: new THREE.Vector2(0.5, 0.5) },
      uSpeed: { value: 0.18 },
      uGlow: { value: 0.35 },
      uScale: { value: 1.40 }
    };

    const material = new THREE.ShaderMaterial({
      vertexShader,
      fragmentShader,
      uniforms,
      depthWrite: false,
      depthTest: false
    });

    const geometry = new THREE.PlaneGeometry(2, 2);
    const mesh = new THREE.Mesh(geometry, material);
    scene.add(mesh);

    // Resize handler
    window.addEventListener('resize', () => {
      const w = window.innerWidth;
      const h = window.innerHeight;
      renderer.setSize(w, h);
      uniforms.uResolution.value.set(w, h);
    });

    // Mouse tracking
    window.addEventListener('mousemove', (e) => {
      uniforms.uMouse.value.set(e.clientX / window.innerWidth, 1.0 - e.clientY / window.innerHeight);
    });

    // Animation Loop
    const clock = new THREE.Clock();
    function animate() {
      requestAnimationFrame(animate);
      uniforms.uTime.value = clock.getElapsedTime();
      renderer.render(scene, camera);
    }
    animate();

    // ─── HUD Tuner Bindings ───
    const sliderSpeed = document.getElementById('slider-speed');
    const sliderGlow = document.getElementById('slider-glow');
    const sliderScale = document.getElementById('slider-scale');

    const valSpeed = document.getElementById('val-speed');
    const valGlow = document.getElementById('val-glow');
    const valScale = document.getElementById('val-scale');

    sliderSpeed.addEventListener('input', (e) => {
      const v = parseFloat(e.target.value);
      uniforms.uSpeed.value = v;
      valSpeed.textContent = v.toFixed(2);
    });

    sliderGlow.addEventListener('input', (e) => {
      const v = parseFloat(e.target.value);
      uniforms.uGlow.value = v;
      valGlow.textContent = v.toFixed(2);
    });

    sliderScale.addEventListener('input', (e) => {
      const v = parseFloat(e.target.value);
      uniforms.uScale.value = v;
      valScale.textContent = v.toFixed(2);
    });
  </script>
