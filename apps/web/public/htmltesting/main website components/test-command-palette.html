<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Abyss Prototype — Universal Command Palette</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link href="https://api.fontshare.com/v2/css?f[]=ranade@500,600,700&f[]=switzer@400,500,600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0d0d0f;
      --card-slab: #121215;
      --dock-surface: #1a1a1c;
      --text-primary: #ffffff;
      --text-muted: #71717a;
      --text-title-muted: #a1a1aa;
      --accent: #9be5fb;
      --font-display: 'Ranade', sans-serif;
      --font-body: 'Switzer', sans-serif;
      --font-mono: ui-monospace, SFMono-Regular, monospace;
      --ease-emil: cubic-bezier(0.23, 1, 0.32, 1);
      --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg);
      color: var(--text-primary);
      font-family: var(--font-body);
      min-height: 100vh;
      padding: 0;
      -webkit-font-smoothing: antialiased;
    }

    body.modal-open {
      overflow: hidden;
    }

    .app-canvas {
      position: relative;
      min-height: 100vh;
      background-color: var(--bg);
      border-radius: 0;
      border: none;
      overflow: hidden;
      padding-top: 140px;
    }

    /* Fixed Compact Floating Dock Container */
    .dock-wrapper {
      position: fixed;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      width: calc(100% - 32px);
      max-width: 680px;
      z-index: 1000;
    }

    /* Solid Smooth Dark Slate Slab Dock — Sleek Architectural Radius (14px) */
    .dock-nav {
      position: relative;
      height: 54px;
      padding: 0 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: linear-gradient(180deg, #141416 0%, #0d0d0f 100%);
      border-radius: 14px;
      border: none;
      box-shadow: 
        inset 0 1px 0 rgba(255, 255, 255, 0.08),
        inset 0 -1px 0 rgba(0, 0, 0, 0.5),
        0 16px 36px rgba(0, 0, 0, 0.7);
    }

    .brand {
      font-family: var(--font-display);
      font-weight: 600;
      font-size: 13.5px;
      letter-spacing: 0.08em;
      color: var(--text-primary);
      text-decoration: none;
      padding-left: 4px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .brand-icon {
      color: var(--accent);
      flex-shrink: 0;
    }

    .nav-links {
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .nav-link {
      position: relative;
      overflow: hidden;
      font-size: 13.5px;
      font-weight: 500;
      color: var(--text-muted);
      text-decoration: none;
      padding: 6px 12px;
      border-radius: 8px;
      z-index: 1;
      transition: color 200ms var(--ease-out), font-weight 200ms var(--ease-out);
    }

    .nav-link::before {
      content: '';
      position: absolute;
      inset: 0;
      background: var(--accent);
      border-radius: 8px;
      transform: translate3d(-105%, 105%, 0) skewX(-18deg);
      transition: transform 240ms var(--ease-out);
      z-index: -1;
      pointer-events: none;
    }

    .nav-link:hover::before {
      transform: translate3d(0, 0, 0) skewX(0deg);
    }

    .nav-link:hover {
      color: #000000;
      font-weight: 600;
    }

    .nav-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .search-trigger, .github-link {
      position: relative;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 34px;
      height: 34px;
      border-radius: 10px;
      background: var(--dock-surface);
      border: none;
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.06);
      color: var(--text-muted);
      text-decoration: none;
      cursor: pointer;
      z-index: 1;
      transition: 
        color 180ms var(--ease-out),
        transform 180ms var(--ease-out);
    }

    .search-trigger::before, .github-link::before {
      content: '';
      position: absolute;
      inset: 0;
      background: var(--accent);
      border-radius: 10px;
      transform: translate3d(-105%, 105%, 0) skewX(-18deg);
      transition: transform 240ms var(--ease-out);
      z-index: -1;
      pointer-events: none;
    }

    @media (hover: hover) and (pointer: fine) {
      .search-trigger:hover::before, .github-link:hover::before {
        transform: translate3d(0, 0, 0) skewX(0deg);
      }

      .search-trigger:hover, .github-link:hover {
        color: #000000;
        transform: translateY(-1px);
      }
    }

    /* Modal Command Palette Overlay */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      z-index: 2000;
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      transition: opacity 220ms var(--ease-out), visibility 220ms var(--ease-out);
    }

    .modal-overlay.open {
      opacity: 1;
      visibility: visible;
      pointer-events: auto;
    }

    /* Command Palette Modal — Dark Charcoal Slate Finish */
    .search-modal {
      width: 680px;
      max-width: 100%;
      background: linear-gradient(180deg, #111113 0%, #08080a 100%);
      border: none;
      border-radius: 14px;
      overflow: hidden;
      box-shadow: 
        inset 0 1px 0 rgba(255, 255, 255, 0.07),
        inset 0 -1px 0 rgba(0, 0, 0, 0.6),
        0 28px 72px rgba(0, 0, 0, 0.9);
    }

    .search-header {
      display: flex;
      align-items: center;
      padding: 20px 24px;
      border-bottom: none;
      gap: 14px;
      background: rgba(255, 255, 255, 0.015);
    }

    .search-brand-tag {
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--accent);
      flex-shrink: 0;
    }
    
    .search-input {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      color: var(--text-primary);
      font-family: var(--font-body);
      font-size: 16.5px;
      font-weight: 500;
      letter-spacing: -0.01em;
    }

    .search-input::placeholder {
      color: var(--text-muted);
      font-weight: 400;
    }

    .kbd-esc {
      font-family: var(--font-mono);
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.06em;
      padding: 4px 8px;
      border-radius: 6px;
      background: #18181c;
      color: var(--text-muted);
      border: 1px solid rgba(255, 255, 255, 0.12);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.08);
      cursor: pointer;
    }

    .results-list {
      max-height: 380px;
      overflow-y: auto;
      padding: 14px 18px;
      scrollbar-width: none;
      -ms-overflow-style: none;
    }

    /* Completely Hidden Scrollbar */
    .results-list::-webkit-scrollbar {
      display: none;
    }

    .category-title {
      font-family: var(--font-mono);
      font-size: 11px;
      color: var(--text-muted);
      padding: 10px 12px 6px 12px;
      letter-spacing: 0.05em;
    }

    .result-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 14px;
      border-radius: 10px;
      text-decoration: none;
      color: var(--text-primary);
      margin-bottom: 4px;
      background: transparent;
      transition: background 200ms var(--ease-out);
    }

    .result-item:hover, .result-item.selected {
      background: rgba(255, 255, 255, 0.06);
    }

    .result-item.selected .item-name {
      color: var(--accent);
    }

    .item-name { font-size: 14px; font-weight: 500; }
    .route-badge { font-family: var(--font-mono); font-size: 11px; color: var(--text-muted); }

    .search-footer {
      padding: 14px 24px;
      border-top: none;
      display: flex;
      align-items: center;
      justify-content: flex-end;
      font-size: 12px;
      color: var(--text-muted);
    }

    .footer-keys { display: flex; gap: 16px; }

    .kbd-badge {
      font-family: var(--font-mono);
      font-size: 11px;
      padding: 3px 7px;
      border-radius: 5px;
      background: #18181c;
      color: var(--text-muted);
      border: 1px solid rgba(255, 255, 255, 0.08);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 3px;
    }
  </style>
</head>

  <script>
    // Command Palette Modal & Keyboard Selection Logic
    const openBtn = document.getElementById('openSearchBtn');
    const closeBtn = document.getElementById('closeSearchBtn');
    const overlay = document.getElementById('searchModalOverlay');
    const input = document.getElementById('searchInput');

    let selectedIndex = 1; // Default to 'Collection Grid'

    function getVisibleItems() {
      return Array.from(document.querySelectorAll('.result-item')).filter(item => {
        return item.style.display !== 'none' && item.offsetParent !== null;
      });
    }

    function setSelectedIndex(newIndex) {
      const items = getVisibleItems();
      if (items.length === 0) return;
      
      items.forEach(item => item.classList.remove('selected'));
      selectedIndex = (newIndex + items.length) % items.length;
      
      const activeItem = items[selectedIndex];
      activeItem.classList.add('selected');
      activeItem.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
    }

    function openModal() {
      overlay.classList.add('open');
      document.body.classList.add('modal-open');
      setTimeout(() => {
        input.focus();
        setSelectedIndex(1);
      }, 50);
    }

    function closeModal() {
      overlay.classList.remove('open');
      document.body.classList.remove('modal-open');
    }

    openBtn.addEventListener('click', openModal);
    closeBtn.addEventListener('click', closeModal);

    overlay.addEventListener('click', (e) => {
      if (e.target === overlay) closeModal();
    });

    // Mouse Hover Sync with Selection
    document.querySelectorAll('.result-item').forEach((item) => {
      item.addEventListener('mouseenter', () => {
        const items = getVisibleItems();
        const idx = items.indexOf(item);
        if (idx !== -1) setSelectedIndex(idx);
      });
    });

    document.addEventListener('keydown', (e) => {
      if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k') {
        e.preventDefault();
        if (overlay.classList.contains('open')) {
          closeModal();
        } else {
          openModal();
        }
        return;
      }

      if (!overlay.classList.contains('open')) return;

      if (e.key === 'Escape') {
        closeModal();
      } else if (e.key === 'ArrowDown') {
        e.preventDefault();
        setSelectedIndex(selectedIndex + 1);
      } else if (e.key === 'ArrowUp') {
        e.preventDefault();
        setSelectedIndex(selectedIndex - 1);
      } else if (e.key === 'Enter') {
        e.preventDefault();
        const items = getVisibleItems();
        if (items[selectedIndex]) {
          items[selectedIndex].click();
        }
      }
    });

    input.addEventListener('input', () => {
      const q = input.value.toLowerCase().trim();
      document.querySelectorAll('.result-item').forEach(item => {
        const text = item.textContent.toLowerCase();
        item.style.display = text.includes(q) ? 'flex' : 'none';
      });
      document.querySelectorAll('.category-group').forEach(group => {
        const visible = group.querySelectorAll('.result-item[style="display: flex;"], .result-item:not([style*="display: none"])');
        group.style.display = visible.length > 0 ? 'block' : 'none';
      });
      setSelectedIndex(0);
    });
  </script>
</body>
