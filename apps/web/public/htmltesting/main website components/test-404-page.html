<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 — Abyss (Cinematic Atmospheric Void)</title>
  
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <link href="https://api.fontshare.com/v2/css?f[]=switzer@400,500,600&display=swap" rel="stylesheet">

  <!-- Three.js -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

  <!-- Local Saint Regus Font -->
  <style>
    @font-face {
      font-family: 'Saint Regus';
      src: url('/fonts/saint-regus/sonar-hubermann-saintregus-semibold.otf') format('opentype');
      font-weight: 600;
      font-style: normal;
      font-display: swap;
    }

    @font-face {
      font-family: 'Saint Regus Expanded';
      src: url('/fonts/saint-regus/sonar-hubermann-saintregus-semiboldexpanded.otf') format('opentype');
      font-weight: 600;
      font-style: normal;
      font-display: swap;
    }

    :root {
      --bg: #060608;
      --accent: #9be5fb;
      --text-white: #ededee;
      --text-muted: #8e8e93;
      --font-display: 'Saint Regus', 'Saint Regus Expanded', serif;
      --font-body: 'Switzer', -apple-system, sans-serif;
      --font-mono: 'JetBrains Mono', monospace;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    ::selection {
      background: #9be5fb !important;
      color: #09090b !important;
    }

    body {
      background-color: var(--bg);
      color: var(--text-white);
      font-family: var(--font-body);
      min-height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    /* Ambient Shader Background Canvas */
    #shader-bg {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      z-index: 1;
      pointer-events: none;
    }

    /* Minimal Top-Right Aesthetic Switcher */
    .dropdown-container {
      position: absolute;
      top: 24px;
      right: 28px;
      z-index: 30;
      user-select: none;
    }
    .dropdown-trigger {
      display: flex;
      align-items: center;
      gap: 10px;
      background: rgba(14, 14, 18, 0.85);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 10px;
      padding: 8px 14px;
      color: #ededee;
      font-family: 'JetBrains Mono', monospace;
      font-size: 11.5px;
      font-weight: 500;
      letter-spacing: 0.02em;
      cursor: pointer;
      box-shadow: 0 12px 28px rgba(0, 0, 0, 0.8);
      transition: all 0.2s ease;
    }
    .dropdown-trigger:hover {
      background: rgba(22, 22, 28, 0.95);
      border-color: rgba(255, 255, 255, 0.18);
    }
    .dropdown-trigger span.active-name {
      color: #9be5fb;
      font-weight: 600;
    }
    .dropdown-trigger svg {
      width: 12px;
      height: 12px;
      stroke: #a1a1aa;
      transition: transform 0.2s ease;
    }
    .dropdown-container.open .dropdown-trigger svg {
      transform: rotate(180deg);
    }
    .dropdown-menu {
      position: absolute;
      top: calc(100% + 6px);
      right: 0;
      width: 250px;
      background: rgba(14, 14, 18, 0.95);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 10px;
      padding: 5px;
      box-shadow: 0 16px 36px rgba(0, 0, 0, 0.9);
      display: none;
      flex-direction: column;
      gap: 2px;
    }
    .dropdown-container.open .dropdown-menu {
      display: flex;
    }
    .dropdown-item {
      padding: 9px 12px;
      border-radius: 6px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      color: #a1a1aa;
      cursor: pointer;
      transition: all 0.15s ease;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .dropdown-item:hover {
      background: rgba(255, 255, 255, 0.08);
      color: #ffffff;
    }
    .dropdown-item.active {
      background: #25252c;
      color: #9be5fb;
      font-weight: 600;
    }
    .dropdown-item.active::after {
      content: '✓';
      font-size: 10px;
      color: #9be5fb;
    }

    /* Central Editorial Content */
    .hero-content {
      position: relative;
      z-index: 10;
      text-align: center;
      max-width: 680px;
      padding: 0 24px;
    }

    /* Giant 404 Headline in Saint Regus */
    .hero-title {
      font-family: var(--font-display);
      font-size: clamp(88px, 16vw, 170px);
      font-weight: 600;
      line-height: 0.95;
      letter-spacing: 0.02em;
      color: #ffffff;
      margin-bottom: 24px;
      text-shadow: 0 16px 50px rgba(0, 0, 0, 0.95);
    }

    .hero-desc {
      font-family: var(--font-body);
      font-size: 19px;
      line-height: 1.55;
      color: var(--text-muted);
      max-width: 480px;
      margin: 0 auto 36px auto;
      letter-spacing: -0.015em;
    }

    .hero-actions {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 32px;
    }

    .link-btn {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-family: var(--font-mono);
      font-size: 13.5px;
      font-weight: 450;
      color: var(--accent);
      text-decoration: none;
      position: relative;
      padding-bottom: 3px;
      cursor: pointer;
    }

    .link-btn .line {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      height: 1.5px;
      background: var(--accent);
      border-radius: 1px;
      transform: scaleX(0);
      transform-origin: left;
      transition: transform 600ms cubic-bezier(0.22, 1, 0.36, 1);
    }

    .link-btn:hover .line {
      transform: scaleX(1);
    }

    .link-btn .arrow {
      display: inline-flex;
      align-items: center;
      transition: transform 250ms cubic-bezier(0.16, 1, 0.3, 1);
    }

    .link-btn:hover .arrow {
      transform: translate(2.5px, -2.5px);
    }

    .link-btn-secondary {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-family: var(--font-mono);
      font-size: 13.5px;
      font-weight: 450;
      color: var(--text-muted);
      text-decoration: none;
      position: relative;
      padding-bottom: 3px;
      cursor: pointer;
      transition: color 150ms ease;
    }

    .link-btn-secondary:hover {
      color: #ffffff;
    }

    .link-btn-secondary .line {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      height: 1.5px;
      background: #ffffff;
      border-radius: 1px;
      transform: scaleX(0);
      transform-origin: left;
      transition: transform 600ms cubic-bezier(0.22, 1, 0.36, 1);
    }

    .link-btn-secondary:hover .line {
      transform: scaleX(1);
    }

    .link-btn-secondary .arrow {
      display: inline-flex;
      align-items: center;
      transition: transform 250ms cubic-bezier(0.16, 1, 0.3, 1);
    }

    .link-btn-secondary:hover .arrow {
      transform: translate(2.5px, -2.5px);
    }
  </style>
</head>
<body>

  <!-- Minimal Mode Switcher Dropdown -->
  <div class="dropdown-container" id="dropdown">
    <div class="dropdown-trigger" onclick="toggleDropdown()">
      <span>Atmosphere: <span class="active-name" id="selected-label">Anamorphic Light Beam</span></span>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="6 9 12 15 18 9"></polyline>
      </svg>
    </div>
    <div class="dropdown-menu">
      <div class="dropdown-item active" onclick="selectShaderMode(0, 'Anamorphic Light Beam')">01: Anamorphic Light Beam</div>
      <div class="dropdown-item" onclick="selectShaderMode(1, 'Velvet Studio Keylight')">02: Velvet Studio Keylight</div>
      <div class="dropdown-item" onclick="selectShaderMode(2, 'Minimal Obsidian Horizon')">03: Minimal Obsidian Horizon</div>
    </div>
  </div>

  <!-- Ambient Dark Volumetric Shader Canvas -->
  <canvas id="shader-bg"></canvas>

  <!-- Central Editorial Hero with Saint Regus -->
  <main class="hero-content">
    <h1 class="hero-title">
      404
    </h1>

    <p class="hero-desc">
      Are you lost, or did you just want to see what our 404 looks like?
    </p>

    <div class="hero-actions">
      <a href="/collection" class="link-btn">
        <span>Return to Collection</span>
        <span class="arrow">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="7" y1="17" x2="17" y2="7"></line>
            <polyline points="7 7 17 7 17 17"></polyline>
          </svg>
        </span>
        <span class="line"></span>
      </a>

      <a href="/docs" class="link-btn-secondary">
        <span>Documentation</span>
        <span class="arrow">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="7" y1="17" x2="17" y2="7"></line>
            <polyline points="7 7 17 7 17 17"></polyline>
          </svg>
        </span>
        <span class="line"></span>
      </a>
    </div>
  </main>

  <script>
    // =========================================================================
    // FIRST-PRINCIPLES CINEMATIC ATMOSPHERIC LIGHTING (NO NOISE SLUDGE)
    // =========================================================================
    const canvas = document.getElementById('shader-bg');
    const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: false });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);

    const scene = new THREE.Scene();
    const camera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);

    const uniforms = {
      uTime: { value: 0.0 },
      uResolution: { value: new THREE.Vector2(window.innerWidth, window.innerHeight) },
      uMouse: { value: new THREE.Vector2(0.5, 0.5) },
      uMode: { value: 0 } // 0: Anamorphic Beam, 1: Studio Keylight, 2: Obsidian Horizon
    };

    const vertexShader = `
      varying vec2 vUv;
      void main() {
        vUv = uv;
        gl_Position = vec4(position, 1.0);
      }
    `;

    const fragmentShader = `
      precision highp float;
      uniform float uTime;
      uniform vec2 uResolution;
      uniform vec2 uMouse;
      uniform int uMode;
      varying vec2 vUv;

      const vec3 cMatteVoid = vec3(0.024, 0.024, 0.028); // #060608 Deepest Obsidian
      const vec3 cCharcoal  = vec3(0.045, 0.045, 0.055); // #0b0b0e Soft Velvet
      const vec3 cIceCyan   = vec3(0.608, 0.898, 0.984); // #9be5fb Ice Cyan
      const vec3 cDeepSlate = vec3(0.06, 0.12, 0.18);

      // =======================================================================
      // PRESET 1: ANAMORPHIC LIGHT BEAM
      // Ultra-wide horizontal cinematic atmospheric lens flare that breathes softly
      // =======================================================================
      vec3 renderAnamorphicBeam(vec2 p, float t, vec2 m) {
        vec2 beamOrigin = vec2(0.0, -0.05) + (m - 0.5) * 0.12;
        vec2 diff = p - beamOrigin;

        // Wide anamorphic aspect stretch
        float xDist = abs(diff.x) * 0.45;
        float yDist = abs(diff.y) * 2.8;
        float beamDist = sqrt(xDist * xDist + yDist * yDist);

        float breath = sin(t * 0.4) * 0.08 + 0.92;
        float coreBeam = exp(-beamDist * (3.8 / breath));
        float softGlow = exp(-beamDist * 1.5) * 0.4;

        // Subtle horizontal streak
        float streak = exp(-abs(diff.y) * 12.0) * exp(-abs(diff.x) * 0.8) * 0.25;

        vec3 beamColor = (cIceCyan * coreBeam * 0.35) + (cDeepSlate * softGlow * 0.8) + (cIceCyan * streak * 0.3);

        // Center editorial depth shadow (keeps 404 crisp)
        float vignette = smoothstep(1.4, 0.2, length(p));

        return cMatteVoid + beamColor * vignette;
      }

      // =======================================================================
      // PRESET 2: VELVET STUDIO KEYLIGHT
      // Soft angled cinematic studio keylight casting gentle ambient illumination
      // =======================================================================
      vec3 renderStudioKeylight(vec2 p, float t, vec2 m) {
        vec2 lightPos = vec2(-0.6, 0.6) + (m - 0.5) * 0.2;
        float dist = length(p - lightPos);

        // Ultra-soft falloff
        float softLight = exp(-dist * 1.2) * 0.5;
        float fillLight = exp(-length(p - vec2(0.5, -0.5)) * 1.8) * 0.25;

        vec3 lightColor = mix(cDeepSlate * 0.6, cIceCyan * 0.3, softLight);
        vec3 fillColor = cCharcoal * fillLight;

        return cMatteVoid + lightColor + fillColor;
      }

      // =======================================================================
      // PRESET 3: MINIMAL OBSIDIAN HORIZON
      // Distant atmospheric horizon curve with deep negative space
      // =======================================================================
      vec3 renderObsidianHorizon(vec2 p, float t, vec2 m) {
        float horizonY = -0.55 + sin(t * 0.3) * 0.02 + (m.y - 0.5) * 0.1;
        float distFromHorizon = p.y - horizonY;

        float horizonGlow = exp(-abs(distFromHorizon) * 2.8) * 0.35;
        float skyGradient = smoothstep(-0.8, 0.8, p.y) * 0.08;

        vec3 color = mix(cMatteVoid, cCharcoal, skyGradient);
        color += (cIceCyan * 0.25 + cDeepSlate * 0.4) * horizonGlow;

        return color;
      }

      void main() {
        vec2 uv = gl_FragCoord.xy / uResolution.xy;
        float aspect = uResolution.x / uResolution.y;
        vec2 p = (uv - 0.5) * vec2(aspect, 1.0);
        float t = uTime * 0.6;
        vec2 m = uMouse;

        vec3 finalColor = vec3(0.0);

        if (uMode == 0) {
          finalColor = renderAnamorphicBeam(p, t, m);
        } else if (uMode == 1) {
          finalColor = renderStudioKeylight(p, t, m);
        } else {
          finalColor = renderObsidianHorizon(p, t, m);
        }

        // Extremely faint luxury dither to eliminate 8-bit gradient banding
        float dither = (fract(sin(dot(gl_FragCoord.xy, vec2(12.9898, 78.233))) * 43758.5453) - 0.5) * 0.004;
        finalColor += vec3(dither);

        gl_FragColor = vec4(finalColor, 1.0);
      }
    `;

    const material = new THREE.ShaderMaterial({
      uniforms,
      vertexShader,
      fragmentShader,
      depthWrite: false,
      depthTest: false
    });

    const mesh = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), material);
    scene.add(mesh);

    // =========================================================================
    // DROPDOWN INTERACTION
    // =========================================================================
    const dropdown = document.getElementById('dropdown');
    const selectedLabel = document.getElementById('selected-label');

    function toggleDropdown() {
      dropdown.classList.toggle('open');
    }

    document.addEventListener('click', (e) => {
      if (!dropdown.contains(e.target)) {
        dropdown.classList.remove('open');
      }
    });

    function selectShaderMode(modeIndex, name) {
      document.querySelectorAll('.dropdown-item').forEach((item, i) => {
        item.classList.toggle('active', i === modeIndex);
      });
      selectedLabel.innerText = name;
      uniforms.uMode.value = modeIndex;
      dropdown.classList.remove('open');
    }

    let mouseTarget = { x: 0.5, y: 0.5 };

    window.addEventListener('mousemove', (e) => {
      mouseTarget.x = e.clientX / window.innerWidth;
      mouseTarget.y = 1.0 - (e.clientY / window.innerHeight);
    });

    const clock = new THREE.Clock();

    function animate() {
      requestAnimationFrame(animate);
      const elapsed = clock.getElapsedTime();
      uniforms.uTime.value = elapsed;

      uniforms.uMouse.value.x += (mouseTarget.x - uniforms.uMouse.value.x) * 0.03;
      uniforms.uMouse.value.y += (mouseTarget.y - uniforms.uMouse.value.y) * 0.03;

      renderer.render(scene, camera);
    }

    animate();

    window.addEventListener('resize', () => {
      renderer.setSize(window.innerWidth, window.innerHeight);
      uniforms.uResolution.value.set(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
