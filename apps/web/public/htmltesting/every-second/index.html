<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Apparatus Every Second — Three.js Folder Tray</title>
  <link rel="stylesheet" href="https://api.fontshare.com/v2/css?f[]=switzer@400,500,600,700&f[]=ranade@600,700&display=swap">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Allura&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500;1,600&family=Playfair+Display:ital,wght@0,400;0,600;1,400;1,600&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
  <style>
    @font-face {
      font-family: 'Allura';
      src: url('/fonts/allura/Allura-Regular.ttf') format('truetype');
      font-weight: normal;
      font-style: normal;
    }

    @font-face {
      font-family: 'Nautica';
      src: url('/fonts/nautica/Nautica.ttf') format('truetype');
      font-weight: normal;
      font-style: normal;
    }

    @font-face {
      font-family: 'SaintRegus';
      src: url('/fonts/saint-regus/sonar-hubermann-saintregus-semibold.otf') format('opentype');
      font-weight: 600;
    }

    :root {
      --bg: #f5f4f0;
      --text: #111113;
      --font-body: 'Switzer', sans-serif;
      --font-display: 'Ranade', sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      margin: 0;
      padding: 0;
      background: linear-gradient(rgba(0, 0, 0, 0.025) 1px, transparent 1px),
                  linear-gradient(90deg, rgba(0, 0, 0, 0.025) 1px, transparent 1px),
                  radial-gradient(circle at 86% 86%, rgba(0, 0, 0, 0.045) 0%, rgba(0, 0, 0, 0.015) 45%, transparent 74%),
                  radial-gradient(circle at 14% 14%, rgba(255, 255, 255, 0.65) 0%, transparent 60%),
                  #f4f1ea;
      background-size: 32px 32px, 32px 32px, 100% 100%, 100% 100%, 100% 100%;
      font-family: var(--font-body);
      overflow: hidden;
      width: 100vw;
      height: 100vh;
      cursor: default;
    }

    /* Handcrafted Optical Crystal Glass Floating Pill Badge */
    .floating-glass-pill {
      position: fixed;
      top: 0;
      left: 0;
      pointer-events: none;
      z-index: 999999;
      will-change: transform, opacity;
      padding: 0 16px;
      border-radius: 999px;
      background: rgba(22, 22, 26, 0.62);
      backdrop-filter: blur(24px) saturate(190%) contrast(105%);
      -webkit-backdrop-filter: blur(24px) saturate(190%) contrast(105%);
      border: 1px solid rgba(255, 255, 255, 0.22);
      border-top: 1.2px solid rgba(255, 255, 255, 0.75);
      border-bottom: 1px solid rgba(255, 255, 255, 0.12);
      box-shadow: 0 14px 32px -4px rgba(0, 0, 0, 0.28),
                  0 4px 10px rgba(0, 0, 0, 0.12),
                  inset 0 1px 1px 0 rgba(255, 255, 255, 0.45),
                  inset 0 -1px 1px 0 rgba(0, 0, 0, 0.10);
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      transition: opacity 0.20s ease;
      user-select: none;
      white-space: nowrap;
      height: 30px;
    }

    .pill-text-inner {
      display: inline-block;
      line-height: 1;
      transition: transform 0.20s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.18s ease;
    }

    .pill-text-inner.is-changing {
      opacity: 0;
      transform: translateY(-2px) scale(0.92);
    }

    .floating-glass-pill.is-visible {
      opacity: 1;
    }

    #webgl-canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: block;
      outline: none;
      z-index: 3;
    }

    /* Flanking Split-Text Backdrop Typography (Intimate Framing) */
    #backdrop-phrase-wrapper {
      position: fixed;
      top: 50%;
      left: 0;
      width: 100vw;
      height: 0;
      pointer-events: none;
      z-index: 2;
    }

    .phrase-flank {
      position: absolute;
      top: 0;
      transform: translateY(-50%);
      font-family: 'Playfair Display', serif;
      font-style: italic;
      font-size: clamp(24px, 3.2vw, 48px);
      color: rgba(17, 17, 19, 0.90);
      width: 24vw;
      line-height: 1.18;
      letter-spacing: -0.015em;
      opacity: 0;
      user-select: none;
      will-change: transform, opacity;
    }

    #phrase-left {
      right: 71.8vw;
      text-align: right;
    }

    #phrase-right {
      left: 71.8vw;
      text-align: left;
    }

    /* Minimalist Precision Mechanical Clock & Date HUD */
    .time-hud {
      position: fixed;
      top: 32px;
      left: 94px;
      z-index: 20;
      pointer-events: none;
      user-select: none;
      font-family: var(--font-body);
      display: flex;
      flex-direction: column;
    }

    .date-line {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.10em;
      color: rgba(17, 17, 19, 0.45);
      text-transform: uppercase;
      font-variant-numeric: tabular-nums;
      margin-bottom: 2px;
    }

    .mech-clock {
      display: flex;
      align-items: center;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Switzer", ui-monospace, monospace, sans-serif;
      font-size: 14px;
      font-weight: 600;
      letter-spacing: 0.04em;
      color: #111113;
      height: 1.15em;
      line-height: 1.15em;
      overflow: hidden;
    }

    .mech-col {
      height: 1.15em;
      line-height: 1.15em;
      overflow: hidden;
      display: inline-block;
    }

    .mech-strip {
      display: flex;
      flex-direction: column;
      transform: translateY(0em);
      transition: transform 0.38s cubic-bezier(0.16, 1, 0.3, 1);
      will-change: transform;
    }

    .mech-strip span {
      display: block;
      height: 1.15em;
      line-height: 1.15em;
      text-align: center;
      width: 0.65em;
    }

    .mech-colon {
      display: inline-block;
      height: 1.15em;
      line-height: 1.15em;
      margin: 0 1.5px;
      opacity: 0.45;
      font-weight: 500;
    }
  </style>
</head>
<body>

  <!-- Minimalist Precision Mechanical Clock & Date HUD -->
  <div class="time-hud hud">
    <div class="date-line" id="date-display">AUG 26, 2026</div>
    <div class="mech-clock">
      <div class="mech-col"><div class="mech-strip" id="h1"><span>0</span><span>1</span><span>2</span></div></div>
      <div class="mech-col"><div class="mech-strip" id="h2"><span>0</span><span>1</span><span>2</span><span>3</span><span>4</span><span>5</span><span>6</span><span>7</span><span>8</span><span>9</span></div></div>
      <span class="mech-colon">:</span>
      <div class="mech-col"><div class="mech-strip" id="m1"><span>0</span><span>1</span><span>2</span><span>3</span><span>4</span><span>5</span></div></div>
      <div class="mech-col"><div class="mech-strip" id="m2"><span>0</span><span>1</span><span>2</span><span>3</span><span>4</span><span>5</span><span>6</span><span>7</span><span>8</span><span>9</span></div></div>
      <span class="mech-colon">:</span>
      <div class="mech-col"><div class="mech-strip" id="s1"><span>0</span><span>1</span><span>2</span><span>3</span><span>4</span><span>5</span></div></div>
      <div class="mech-col"><div class="mech-strip" id="s2"><span>0</span><span>1</span><span>2</span><span>3</span><span>4</span><span>5</span><span>6</span><span>7</span><span>8</span><span>9</span></div></div>
    </div>
  </div>

  <!-- Flanking Split-Text Backdrop Typography -->
  <div id="backdrop-phrase-wrapper">
    <div id="phrase-left" class="phrase-flank">
      We don't see things as they are,
    </div>
    <div id="phrase-right" class="phrase-flank">
      we see them as we are.
    </div>
  </div>

  <!-- Handcrafted Optical Crystal Glass Floating Pill Badge -->
  <div class="floating-glass-pill" id="floating-pill">
    <span class="pill-text-inner" id="pill-label">expand</span>
  </div>

  <canvas id="webgl-canvas"></canvas>

  <script>
    const IMAGES = Array.from({ length: 24 }, (_, i) => 
      `/images/components/cascade-gallery/photo-${String(i + 1).padStart(2, '0')}.webp`
    );

    // 1. Scene & Renderer Setup
    const canvas = document.getElementById("webgl-canvas");
    const renderer = new THREE.WebGLRenderer({
      canvas,
      antialias: true,
      alpha: true,
      powerPreference: "high-performance",
    });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);

    const scene = new THREE.Scene();

    // 2. Camera Setup (Low FOV telephoto pulled back for spacious editorial margins)
    const camera = new THREE.PerspectiveCamera(17, window.innerWidth / window.innerHeight, 0.1, 200);
    camera.position.set(0, 0, 42);

    // Card geometry with 16:9 widescreen aspect ratio & BOTTOM HINGE pivot
    const cardWidth = 3.0;
    const cardHeight = 1.6875;
    const cardGeo = new THREE.PlaneGeometry(cardWidth, cardHeight);
    cardGeo.translate(0, cardHeight / 2, 0); // shift pivot to bottom edge

    // Static Hit Proxy Geometry
    const proxyGeo = new THREE.PlaneGeometry(cardWidth * 1.05, cardHeight * 1.15);
    proxyGeo.translate(0, cardHeight / 2, 0);
    const hitProxies = [];

    // Diagonal Corner-to-Corner Trajectory
    const dirX = 1.62;
    const dirY = 0.90;
    const dirZ = -0.05;

    const stepDist = 0.22;
    const totalCards = 96;
    const cards = [];

    // Custom Frosted Glass GLSL Shaders (Soft Organic Glass Slabs)
    const glassVertexShader = `
      varying vec2 vUv;
      varying vec3 vNormal;
      varying vec3 vViewPosition;

      void main() {
        vUv = uv;
        vNormal = normalize(normalMatrix * normal);
        vec4 mvPosition = modelViewMatrix * vec4(position, 1.0);
        vViewPosition = -mvPosition.xyz;
        gl_Position = projectionMatrix * mvPosition;
      }
    `;

    const glassFragmentShader = `
      uniform sampler2D uTexture;
      uniform float uBlur;
      uniform float uAspect;
      uniform float uDepthAlpha;
      uniform float uIntroFade;
      uniform float uThermalNeg;
      varying vec2 vUv;
      varying vec3 vNormal;
      varying vec3 vViewPosition;

      float roundedBoxSDF(vec2 p, vec2 b, float r) {
        vec2 q = abs(p) - b + r;
        return min(max(q.x, q.y), 0.0) + length(max(q, 0.0)) - r;
      }

      void main() {
        vec2 p = (vUv - 0.5) * vec2(uAspect, 1.0);
        vec2 size = vec2(uAspect * 0.5, 0.5);
        float radius = 0.0; // Razor-sharp 90-degree architectural corners

        float dist = roundedBoxSDF(p, size, radius);
        
        // Razor-sharp sub-pixel antialiased glass boundary
        float edgeAlpha = smoothstep(0.0015, -0.0015, dist);
        if (edgeAlpha <= 0.0) discard;

        // 1. Photographic Image Transmission & Diffusion
        vec2 uv = vUv;
        float blur = uBlur * 0.0012;
        vec4 col = texture2D(uTexture, uv);
        if (blur > 0.0001) {
          col = texture2D(uTexture, uv) * 0.40
              + texture2D(uTexture, uv + vec2(blur, blur)) * 0.15
              + texture2D(uTexture, uv + vec2(-blur, blur)) * 0.15
              + texture2D(uTexture, uv + vec2(blur, -blur)) * 0.15
              + texture2D(uTexture, uv + vec2(-blur, -blur)) * 0.15;
        }

        // 2. Delicate Angle-dependent Glass Grazing Sheen
        vec3 viewDir = normalize(vViewPosition);
        float fresnel = pow(1.0 - max(dot(viewDir, vNormal), 0.0), 3.0) * 0.06;

        vec3 finalColor = col.rgb;

        // Thermal Chemical Negative Inversion Mode
        if (uThermalNeg > 0.001) {
          vec3 inverted = vec3(1.0) - finalColor;
          vec3 thermal = vec3(inverted.r * 0.2, inverted.g * 0.8, inverted.b * 1.2);
          finalColor = mix(finalColor, thermal, uThermalNeg);
        }

        finalColor += vec3(fresnel);
        float alpha = edgeAlpha * 0.98 * uDepthAlpha * uIntroFade;

        gl_FragColor = vec4(finalColor, alpha);
      }
    `;

    // Helper to create raw image card with custom glass shader
    function createCard(tex) {
      const mat = new THREE.ShaderMaterial({
        vertexShader: glassVertexShader,
        fragmentShader: glassFragmentShader,
        uniforms: {
          uTexture: { value: tex },
          uBlur: { value: 2.8 },
          uAspect: { value: cardWidth / cardHeight },
          uDepthAlpha: { value: 1.0 },
          uIntroFade: { value: 0.0 },
          uThermalNeg: { value: 0.0 },
        },
        transparent: true,
        side: THREE.DoubleSide,
        depthTest: true,
        depthWrite: true,
      });

      const mesh = new THREE.Mesh(cardGeo, mat);
      
      // Group for orientation + local domino pitch
      const group = new THREE.Group();
      group.rotation.set(0.14, -0.84, -0.15); // track alignment
      group.add(mesh);

      scene.add(group);
      return { group, mesh, mat };
    }

    // Global Luminescent Intro Animation State
    const introBloom = {
      fade: 0.0,
      blur: 6.0,
    };

    function startApp(loadedTextures) {
      // Initialize Card Pool + Static Hit Proxies with fully decoded textures
      for (let i = 0; i < totalCards; i++) {
        const tex = loadedTextures[i % loadedTextures.length];
        const cardObj = createCard(tex);
        
        const proxyMat = new THREE.MeshBasicMaterial({ visible: false });
        const proxyMesh = new THREE.Mesh(proxyGeo, proxyMat);
        proxyMesh.userData = { cardIndex: i };
        cardObj.group.add(proxyMesh);
        hitProxies.push(proxyMesh);

        cards.push({
          ...cardObj,
          index: i,
          localPitch: 0,
          hoverLift: 0,
          introPitch: 0.15,
          introFade: 0.0,
          introThermal: 1.0, // starts as glowing inverted thermal emulsion
        });
      }

      // 1. Thermal Emulsion Chemical Crystallization Sequence
      cards.forEach((card, idx) => {
        const cardOrder = (idx % 24);
        const delay = 0.06 + cardOrder * 0.045;

        gsap.to(card, {
          introThermal: 0.0,  // crystallizes into vivid photographic clarity
          introPitch: 0.0,
          introFade: 1.0,
          duration: 1.85,
          delay: delay,
          ease: "power2.inOut",
        });
      });

      // 2. Optical Bokeh Flare into Photographic Focus
      gsap.to(introBloom, {
        fade: 1.0,
        blur: 0.0,
        duration: 2.4,
        ease: "power3.out"
      });

      // 3. Cinematic Camera Push-In Glide
      gsap.fromTo(camera.position,
        { z: 47, y: -0.8 },
        { z: 42, y: 0.0, duration: 2.4, ease: "power3.out" }
      );

      // 4. Synchronized HUD Reveal
      gsap.fromTo(".hud", 
        { opacity: 0, y: -12 }, 
        { opacity: 1, y: 0, duration: 1.4, delay: 0.6, ease: "power2.out" }
      );

      animate();
    }

    // 100% Texture Preloader (Guarantees zero black flashes on load)
    const textureLoader = new THREE.TextureLoader();
    function loadSingleTexture(src) {
      return new Promise((resolve) => {
        textureLoader.load(src, (tex) => {
          tex.generateMipmaps = true;
          tex.minFilter = THREE.LinearMipmapLinearFilter;
          resolve(tex);
        });
      });
    }

    Promise.all(IMAGES.map(loadSingleTexture)).then((loadedTextures) => {
      startApp(loadedTextures);
    });

    // Heavy Floating Glass Pill Badge
    const floatingPillEl = document.getElementById("floating-pill");
    const pillLabelEl = document.getElementById("pill-label");
    const setPillX = gsap.quickSetter(floatingPillEl, "x", "px");
    const setPillY = gsap.quickSetter(floatingPillEl, "y", "px");
    const setPillRotation = gsap.quickSetter(floatingPillEl, "rotation", "deg");

    let currentPillText = "expand";

    function setPillLabel(newText) {
      if (currentPillText === newText) return;
      currentPillText = newText;
      if (!pillLabelEl) return;
      pillLabelEl.classList.add("is-changing");
      setTimeout(() => {
        pillLabelEl.textContent = newText;
        pillLabelEl.classList.remove("is-changing");
      }, 100);
    }

    let clientMouseX = window.innerWidth / 2;
    let clientMouseY = window.innerHeight / 2;
    let pillCurrentX = window.innerWidth / 2;
    let pillCurrentY = window.innerHeight / 2;
    let pillCurrentTilt = 0;

    let smoothBgMouseX = 50;
    let smoothBgMouseY = 50;

    // Three.js Raycaster for Hover Detection
    const raycaster = new THREE.Raycaster();
    const mouse = new THREE.Vector2(-1000, -1000);
    let selectedHoverIndex = null;

    window.addEventListener("pointermove", (e) => {
      clientMouseX = e.clientX;
      clientMouseY = e.clientY;

      mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
      mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
    });

    window.addEventListener("pointerleave", () => {
      mouse.set(-1000, -1000);
      selectedHoverIndex = null;
      floatingPillEl.classList.remove("is-visible");
    });

    // GSAP Choreographed Hero State
    let activeHeroIndex = null;
    let isHeroActive = false;
    let heroTimeline = null;

    const heroAnim = {
      gapOpening: 0,   // 0 -> 1 (rail stacks slide apart & compress)
      liftY: 0,        // vertical arc lift
      flyProgress: 0,  // 0 -> 1 (flight to center & flat rotation at 1x)
      expandScale: 0,  // 0 -> 1 (scale bloom from 1.0x to 1.85x after landing at center)
    };

    // Curated Visually-Matched Editorial Split-Text Quotes (1:1 Photographic Alignment)
    const photoCaptions = [
      { left: "In the silent strike,", right: "the spirit stays unyielding." },
      { left: "Every choice in motion,", right: "shapes what cannot fade." },
      { left: "At the edge of velocity,", right: "the world turns to stillness." },
      { left: "Alone beneath the cosmos,", right: "witnessing architecture of time." },
      { left: "Cold stone and silent peaks,", right: "standing against the wind." },
      { left: "When conviction is tested,", right: "only the resolve endures." },
      { left: "Beneath smoke and fire,", right: "victory needs no defense." },
      { left: "In the arena of giants,", right: "fear gives way to defiance." },
      { left: "The only rival that matters,", right: "is the shadow within." },
      { left: "Behind the dark visor,", right: "the mind locks into clarity." },
      { left: "Quiet watchful eyes,", right: "seeing what shadows conceal." },
      { left: "A spark of light mischief,", right: "in a serious world." },
      { left: "Unbroken in spirit,", right: "running wild across crimson." },
      { left: "A fleeting apparition,", right: "dissolving into memory." },
      { left: "A sea of faces,", right: "each carrying a universe." },
      { left: "Sacred geometry,", right: "poised in timeless grace." },
      { left: "Under the midnight moon,", right: "embracing the dusk." },
      { left: "Defined by shadows,", right: "revealed at the edge of light." },
      { left: "Energy into momentum,", right: "transcending human limits." },
      { left: "Sculpted in ambition,", right: "cast against the darkness." },
      { left: "A flash of burning fury,", right: "roaring into legend." },
      { left: "A battle of wills,", right: "suspended in the dust." },
      { left: "A clean solitary line,", right: "across the silent slope." },
      { left: "Wings against the canopy,", right: "rising in unison." }
    ];

    const phraseLeftEl = document.getElementById("phrase-left");
    const phraseRightEl = document.getElementById("phrase-right");
    const stripTens = document.getElementById("strip-tens");
    const stripUnits = document.getElementById("strip-units");
    let lastRenderedTickerIdx = -1;

    // Extracted Saturated Aesthetic Chromatic Colors for each of the 24 photos
    const PHOTO_COLORS = [
      [42, 75, 160],   // 01: Sapphire Strike
      [45, 80, 140],   // 02: Neon Helmet
      [70, 85, 110],   // 03: Speed Mercedes
      [190, 55, 45],   // 04: Mars Terracotta
      [65, 95, 125],   // 05: Alpine Glacier
      [90, 85, 80],    // 06: Resolve Portrait
      [75, 60, 150],   // 07: Stadium Purple
      [140, 60, 60],   // 08: Podium Defiance
      [175, 115, 35],  // 09: Sunset Gold
      [130, 45, 35],   // 10: Racing Helmet Red
      [90, 95, 105],   // 11: Cross-stitch Cat
      [175, 135, 80],  // 12: Pixel Cat Gold
      [215, 25, 25],   // 13: Crimson Stallion
      [75, 75, 85],    // 14: Monochrome Face
      [180, 110, 60],  // 15: Pop Silhouettes
      [185, 130, 45],  // 16: Cathedral Amber
      [150, 75, 30],   // 17: Midnight Moon Amber
      [80, 85, 95],    // 18: Nocturna Slate
      [45, 110, 120],  // 19: Energy Cyan
      [120, 80, 50],   // 20: Cast Bronze
      [195, 55, 25],   // 21: Ferrari Exhaust Fire
      [110, 100, 85],  // 22: Desert Dust
      [95, 110, 125],  // 23: Snow Mountain Cool
      [35, 115, 55],   // 24: Emerald Canopy
    ];

    let currentHaloR = 42, currentHaloG = 75, currentHaloB = 160;
    let currentHaloOp = 0.085;

    function openHero(index) {
      if (heroTimeline) heroTimeline.kill();
      activeHeroIndex = index;
      isHeroActive = true;

      // Subtle watermark dimming during hero focus
      gsap.to(".corner-watermark", { opacity: 0.22, duration: 0.5, ease: "power2.out" });

      // Set left and right flanking text
      const cap = photoCaptions[index % photoCaptions.length];
      phraseLeftEl.textContent = cap.left;
      phraseRightEl.textContent = cap.right;

      const half = totalCards / 2;
      let offset = index - currentProgress;
      offset = ((((offset + half) % totalCards) + totalCards) % totalCards) - half;

      // Distance-weighted glide duration
      const absOffset = Math.abs(offset);
      const scrollDuration = THREE.MathUtils.clamp(0.75 + absOffset * 0.04, 0.75, 1.6);

      heroTimeline = gsap.timeline();

      // --- STAGE 1: PURE SMOOTH FLUSH CONVEYOR GLIDE ---
      heroAnim.gapOpening = 0;
      heroAnim.liftY = 0;
      heroAnim.flyProgress = 0;
      heroAnim.expandScale = 0;

      const scrollObj = { p: currentProgress };
      heroTimeline.to(scrollObj, {
        p: currentProgress + offset,
        duration: scrollDuration,
        ease: "power2.inOut",
        onUpdate: () => {
          currentProgress = scrollObj.p;
          targetProgress = scrollObj.p;
        }
      }, 0);

      // --- STAGE 2: ONCE ARRIVED AT CENTER -> VELVETY SMOOTH LIFT UP & PART RACK ---
      const arriveTime = scrollDuration;
      heroTimeline.to(heroAnim, { gapOpening: 0.5, duration: 0.85, ease: "power2.out" }, arriveTime);
      heroTimeline.to(heroAnim, { liftY: 2.2, duration: 0.55, ease: "power1.out" }, arriveTime);
      heroTimeline.to(heroAnim, { liftY: 0.0, duration: 0.55, ease: "power2.inOut" }, arriveTime + 0.55);
      heroTimeline.to(heroAnim, { flyProgress: 1.0, duration: 0.95, ease: "power2.out" }, arriveTime);

      // --- STAGE 3: INTENTIONAL PAUSE AT CENTER -> DELAYED BLOOM & MASKED TEXT REVEAL ---
      const bloomTime = arriveTime + 0.90;
      heroTimeline.to(heroAnim, { expandScale: 1.0, duration: 0.70, ease: "power2.out" }, bloomTime);
      heroTimeline.to(heroAnim, { gapOpening: 1.0, duration: 0.70, ease: "power2.out" }, bloomTime);

      // Dual Flanking Ink-Bleed & Convergence In-Animation
      heroTimeline.fromTo([phraseLeftEl, phraseRightEl], 
        { 
          opacity: 0, 
          filter: "blur(22px) contrast(220%)",
        }, 
        { 
          opacity: 0.88, 
          filter: "blur(0px) contrast(100%)",
          duration: 1.25,
          ease: "power2.out"
        }, 
        bloomTime + 0.05
      );

      heroTimeline.fromTo(phraseLeftEl, 
        { x: -32 }, 
        { x: 0, duration: 1.25, ease: "power2.out" }, 
        bloomTime + 0.05
      );

      heroTimeline.fromTo(phraseRightEl, 
        { x: 32 }, 
        { x: 0, duration: 1.25, ease: "power2.out" }, 
        bloomTime + 0.05
      );
    }

    function closeHero(onCompleteCallback) {
      if (heroTimeline) heroTimeline.kill();
      isHeroActive = false;

      heroTimeline = gsap.timeline({
        onComplete: () => {
          heroAnim.gapOpening = 0;
          heroAnim.liftY = 0;
          heroAnim.flyProgress = 0;
          heroAnim.expandScale = 0;
          if (activeHeroIndex !== null && cards[activeHeroIndex]) {
            cards[activeHeroIndex].hoverLift = 0;
            cards[activeHeroIndex].mesh.position.set(0, 0, 0);
            cards[activeHeroIndex].mesh.scale.setScalar(1.0);
            cards[activeHeroIndex].mesh.material.depthTest = true;
          }
          activeHeroIndex = null;
          if (typeof onCompleteCallback === "function") {
            onCompleteCallback();
          }
        }
      });

      // --- STAGE 0: INSTANT FLANKING TEXT DISMISS & RESTORE WATERMARK ---
      gsap.to(".corner-watermark", { opacity: 1.0, duration: 0.7, ease: "power2.out" });
      heroTimeline.to([phraseLeftEl, phraseRightEl], {
        opacity: 0,
        filter: "blur(14px)",
        duration: 0.28,
        ease: "power2.in"
      }, 0);
      heroTimeline.to(phraseLeftEl, { x: -20, duration: 0.28, ease: "power2.in" }, 0);
      heroTimeline.to(phraseRightEl, { x: 20, duration: 0.28, ease: "power2.in" }, 0);

      // --- STAGE 1: GENTLE SHRINK BACK TO 1.0X ---
      heroTimeline.to(heroAnim, { expandScale: 0.0, duration: 0.38, ease: "power2.inOut" }, 0);

      // --- STAGE 2: CALM RETURN FLIGHT ELEVATED IN AIR ---
      heroTimeline.to(heroAnim, { liftY: 2.5, duration: 0.30, ease: "power2.out" }, 0.20);
      heroTimeline.to(heroAnim, { flyProgress: 0.0, duration: 0.58, ease: "power2.inOut" }, 0.25);

      // --- STAGE 3: DROP STRAIGHT DOWN INTO OPEN SLOT ---
      heroTimeline.to(heroAnim, { liftY: 0.0, duration: 0.35, ease: "power2.in" }, 0.80);

      // --- STAGE 4: CLOSE RACK AROUND SEATED PHOTO ---
      heroTimeline.to(heroAnim, { gapOpening: 0.0, duration: 0.45, ease: "power2.out" }, 1.05);
    }

    function switchHero(newIndex) {
      // Staged clean handoff: smooth return -> conveyor glide & new photo bloom
      closeHero(() => {
        openHero(newIndex);
      });
    }

    // Click / Select Listener
    window.addEventListener("click", (e) => {
      if (selectedHoverIndex !== null) {
        if (!isHeroActive) {
          openHero(selectedHoverIndex);
        } else if (selectedHoverIndex === activeHeroIndex) {
          closeHero();
        } else {
          // Direct switch to another card!
          switchHero(selectedHoverIndex);
        }
      } else if (isHeroActive) {
        closeHero(); // click backdrop to dismiss
      }
    });

    // Keyboard Interaction & Accessibility (Apple Design Guidelines)
    window.addEventListener("keydown", (e) => {
      if (e.key === "Escape" && isHeroActive) {
        closeHero();
      } else if (e.key === "ArrowRight" && !isHeroActive) {
        targetProgress += 1.8;
        userScrollVelocity += 35;
      } else if (e.key === "ArrowLeft" && !isHeroActive) {
        targetProgress -= 1.8;
        userScrollVelocity -= 35;
      } else if (e.key === " " && !isHeroActive) {
        e.preventDefault();
        targetProgress += 2.5;
        userScrollVelocity += 45;
      }
    });

    // Scroll & Physics State (Snappy High-Velocity Inertia)
    let targetProgress = 0;
    let currentProgress = 0;
    let userScrollVelocity = 0;

    const scrollSensitivity = 0.0065;
    const ambientDriftSpeed = 0.016; // Perfectly tuned continuous editorial conveyor cadence

    // Fast Responsive Wheel / Trackpad Interaction
    window.addEventListener("wheel", (e) => {
      e.preventDefault();
      if (isHeroActive) return;
      
      const delta = THREE.MathUtils.clamp(e.deltaY * scrollSensitivity, -4.0, 4.0);
      targetProgress += delta;
      userScrollVelocity += delta * 18;
    }, { passive: false });

    // Real-Time Mechanical Precision Clock Updater
    const dateEl = document.getElementById("date-display");
    const stripH1 = document.getElementById("h1");
    const stripH2 = document.getElementById("h2");
    const stripM1 = document.getElementById("m1");
    const stripM2 = document.getElementById("m2");
    const stripS1 = document.getElementById("s1");
    const stripS2 = document.getElementById("s2");

    function updateRealTime() {
      const now = new Date();
      const options = { month: 'short', day: '2-digit', year: 'numeric' };
      if (dateEl) dateEl.textContent = now.toLocaleDateString('en-US', options).toUpperCase();
      
      const hours = String(now.getHours()).padStart(2, '0');
      const mins = String(now.getMinutes()).padStart(2, '0');
      const secs = String(now.getSeconds()).padStart(2, '0');

      if (stripH1) stripH1.style.transform = `translateY(-${Number(hours[0]) * 1.15}em)`;
      if (stripH2) stripH2.style.transform = `translateY(-${Number(hours[1]) * 1.15}em)`;
      if (stripM1) stripM1.style.transform = `translateY(-${Number(mins[0]) * 1.15}em)`;
      if (stripM2) stripM2.style.transform = `translateY(-${Number(mins[1]) * 1.15}em)`;
      if (stripS1) stripS1.style.transform = `translateY(-${Number(secs[0]) * 1.15}em)`;
      if (stripS2) stripS2.style.transform = `translateY(-${Number(secs[1]) * 1.15}em)`;
    }
    updateRealTime();
    setInterval(updateRealTime, 1000);

    // GSAP Clock / RAF Loop
    let lastTime = performance.now();

    function animate() {
      requestAnimationFrame(animate);

      const now = performance.now();
      const dt = Math.min((now - lastTime) / 1000, 0.1);
      lastTime = now;

      // Ambient steady drift (freezes during hero inspection)
      if (!isHeroActive) {
        const driftMultiplier = selectedHoverIndex !== null ? 0.15 : 1.0;
        targetProgress += ambientDriftSpeed * driftMultiplier * dt * 60;
      }

      // Mechanical Rolling Odometer Ticker Update (Only roll when motion settles to center focal image)
      const isConveyorMovingFast = Math.abs(userScrollVelocity) > 2.0 || Math.abs(targetProgress - currentProgress) > 0.45;
      
      if (!isConveyorMovingFast || isHeroActive) {
        const centerIndex = isHeroActive && activeHeroIndex !== null 
          ? ((activeHeroIndex % 24) + 1)
          : ((Math.round(currentProgress) % 24 + 24) % 24 + 1); // 1 to 24

        if (centerIndex !== lastRenderedTickerIdx) {
          lastRenderedTickerIdx = centerIndex;
          const tens = Math.floor(centerIndex / 10);
          const units = centerIndex % 10;
          if (stripTens) stripTens.style.transform = `translateY(-${tens}em)`;
          if (stripUnits) stripUnits.style.transform = `translateY(-${units}em)`;
        }
      }

      // Snappy responsive conveyor progress tracking (0.16 damp)
      const damp = 1 - Math.pow(1 - 0.16, dt * 60);
      currentProgress += (targetProgress - currentProgress) * damp;

      // Velocity decay
      const velDamp = 1 - Math.pow(1 - 0.14, dt * 60);
      userScrollVelocity += (0 - userScrollVelocity) * velDamp;

      // Subtle domino bend
      const targetDominoBend = THREE.MathUtils.clamp(-userScrollVelocity * 0.025, -0.09, 0.09);

      // Continuous Raycast against STATIC proxies
      raycaster.setFromCamera(mouse, camera);
      const intersects = raycaster.intersectObjects(hitProxies);

      if (intersects.length > 0) {
        selectedHoverIndex = intersects[0].object.userData.cardIndex;
      } else {
        selectedHoverIndex = null;
      }

      // Smooth Background Reactive Position Update (Subtle organic lag)
      const targetBgX = (clientMouseX / window.innerWidth) * 100;
      const targetBgY = (clientMouseY / window.innerHeight) * 100;
      const bgDamp = 1 - Math.pow(1 - 0.08, dt * 60);
      smoothBgMouseX += (targetBgX - smoothBgMouseX) * bgDamp;
      smoothBgMouseY += (targetBgY - smoothBgMouseY) * bgDamp;
      document.body.style.setProperty("--mouse-x", `${smoothBgMouseX.toFixed(2)}%`);
      document.body.style.setProperty("--mouse-y", `${smoothBgMouseY.toFixed(2)}%`);

      // Heavy Inertia Drag & Physical Momentum Tilt for Floating Pill Badge
      const targetPillX = clientMouseX + 16;
      const targetPillY = clientMouseY + 16;
      const pillDamp = 1 - Math.pow(1 - 0.11, dt * 60);

      const prevPillX = pillCurrentX;
      const prevPillY = pillCurrentY;
      pillCurrentX += (targetPillX - pillCurrentX) * pillDamp;
      pillCurrentY += (targetPillY - pillCurrentY) * pillDamp;

      const pillVelX = (pillCurrentX - prevPillX) / Math.max(dt, 0.001);
      const targetTilt = THREE.MathUtils.clamp(pillVelX * 0.015, -12, 12);
      pillCurrentTilt += (targetTilt - pillCurrentTilt) * pillDamp;

      setPillX(pillCurrentX);
      setPillY(pillCurrentY);
      setPillRotation(pillCurrentTilt);

      // Update Floating Pill Visibility & Text with Smooth Micro Cross-fade
      if (isHeroActive) {
        floatingPillEl.classList.add("is-visible");
        if (selectedHoverIndex !== null && selectedHoverIndex !== activeHeroIndex) {
          setPillLabel("expand");
        } else {
          setPillLabel("close");
        }
      } else if (selectedHoverIndex !== null) {
        floatingPillEl.classList.add("is-visible");
        setPillLabel("expand");
      } else {
        floatingPillEl.classList.remove("is-visible");
      }

      // Position, Compress Stacks & Expand Selected Hero
      const half = totalCards / 2;

      for (let i = 0; i < totalCards; i++) {
        const card = cards[i];
        let offset = i - currentProgress - (card.introOffset || 0);
        offset = ((((offset + half) % totalCards) + totalCards) % totalCards) - half;

        const isThisHero = (i === activeHeroIndex);
        card.group.visible = true;

        // Domino Pitch (Clean, solid, upright + Cascading Fan Tilt)
        card.localPitch += (targetDominoBend - card.localPitch) * (1 - Math.pow(1 - 0.20, dt * 60));
        card.mesh.rotation.x = card.localPitch + (card.introPitch || 0);

        if (isThisHero && activeHeroIndex !== null) {
          // --- HERO CARD CHOREOGRAPHY ---
          const fp = heroAnim.flyProgress;
          const curScale = THREE.MathUtils.lerp(1.0, 1.85, heroAnim.expandScale);

          // Slot base position on track
          const slotX = offset * stepDist * dirX;
          const slotY = offset * stepDist * dirY + heroAnim.liftY;
          const slotZ = offset * stepDist * dirZ;

          // Dead center target position
          const targetHeroX = 0;
          const targetHeroY = -(cardHeight * curScale) / 2;
          const targetHeroZ = 16;

          // Interpolate from elevated slot to center
          const curX = THREE.MathUtils.lerp(slotX, targetHeroX, fp);
          const curY = THREE.MathUtils.lerp(slotY, targetHeroY, fp);
          const curZ = THREE.MathUtils.lerp(slotZ, targetHeroZ, fp);
          card.group.position.set(curX, curY, curZ);

          // Rotate from rack angle to flat
          card.group.rotation.set(
            THREE.MathUtils.lerp(0.14, 0, fp),
            THREE.MathUtils.lerp(-0.84, 0, fp),
            THREE.MathUtils.lerp(-0.15, 0, fp)
          );

          card.mesh.scale.setScalar(curScale);
          card.mesh.position.set(0, 0, 0);

          // Focus clarity on flight to center
          if (card.mat && card.mat.uniforms) {
            if (card.mat.uniforms.uBlur) card.mat.uniforms.uBlur.value = THREE.MathUtils.lerp(1.0, 0.0, fp);
            if (card.mat.uniforms.uIntroFade) card.mat.uniforms.uIntroFade.value = 1.0;
          }

          // Keep hero elevated over all cards until fully seated in rack
          card.group.renderOrder = 10000;
          const dtVal = (heroAnim.liftY < 0.05 && fp < 0.05);
          card.mat.depthTest = dtVal;

        } else {
          // --- BACKGROUND CARDS: CONVEYOR & LATERAL TAB PULL HOVER ---
          if (card.mat && card.mat.uniforms) {
            if (card.mat.uniforms.uBlur) card.mat.uniforms.uBlur.value = introBloom.blur;
            if (card.mat.uniforms.uIntroFade) card.mat.uniforms.uIntroFade.value = (card.introFade !== undefined ? card.introFade : 1.0);
            if (card.mat.uniforms.uThermalNeg) card.mat.uniforms.uThermalNeg.value = (card.introThermal !== undefined ? card.introThermal : 0.0);
          }

          // Hover State (Velvety weighted physical spring slide)
          const isThisHovered = (i === selectedHoverIndex && i !== activeHeroIndex);
          const targetHover = isThisHovered ? 1.0 : 0.0;
          card.hoverLift += (targetHover - card.hoverLift) * (1 - Math.pow(1 - 0.08, dt * 60));

          // Base continuous conveyor position (100% rigid, zero stretching)
          const normalD = offset * stepDist;
          let compressedD = normalD;
          if (activeHeroIndex !== null) {
            const centerOpening = 3.8;
            const compressedStep = 0.12;
            const absOffset = Math.abs(offset);
            
            if (offset >= 0) {
              compressedD = centerOpening + absOffset * compressedStep;
            } else {
              compressedD = -centerOpening - absOffset * compressedStep;
            }
          }

          // Smooth interpolation via GSAP gapOpening
          const finalD = THREE.MathUtils.lerp(normalD, compressedD, heroAnim.gapOpening);
          card.group.position.set(finalD * dirX, finalD * dirY, finalD * dirZ);

          // Standard rack posture
          card.group.rotation.set(0.14, -0.84, -0.15);

          // The Lateral Tab Pull: slides out perpendicularly on hover
          card.mesh.position.x = card.hoverLift * 1.75;
          card.mesh.position.y = card.hoverLift * 0.40;
          card.mesh.position.z = card.hoverLift * 0.20;
          card.mesh.scale.setScalar(1.0);

          // Elevated renderOrder when pulled out
          if (card.hoverLift > 0.02) {
            card.group.renderOrder = 2000 + Math.round(card.hoverLift * 500);
          } else {
            card.group.renderOrder = Math.round(1000 - offset * 10);
          }
          card.mat.depthTest = true;
        }
      }

      renderer.render(scene, camera);
    }

    // Resize handling
    window.addEventListener("resize", () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
