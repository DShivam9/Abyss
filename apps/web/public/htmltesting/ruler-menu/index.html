<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Abyss High-Density Swiss Navigator</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    @font-face {
      font-family: 'Satoshi';
      src: url('/fonts/Satoshi-Variable.woff2') format('woff2');
      font-weight: 300 900;
      font-display: swap;
      font-style: normal;
    }

    :root {
      --font-body: 'Satoshi', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      --ease-in-glide: cubic-bezier(0.16, 1, 0.3, 1);
      --ease-out-slide: cubic-bezier(0.4, 0, 0.2, 1);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: var(--font-body);
      background-color: #08080a;
      color: #ffffff;
      min-height: 100vh;
      overflow: hidden;
      user-select: none;
      -webkit-font-smoothing: antialiased;
    }

    /* Architectural Background Grid */
    .bg-grid {
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(to right, rgba(255, 255, 255, 0.02) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(255, 255, 255, 0.02) 1px, transparent 1px);
      background-size: 48px 48px;
      pointer-events: none;
      z-index: 0;
    }

    /* =========================================
       STATIC 3-LINE KEYCAP BUTTON
       ========================================= */

    .top-left-menu {
      position: fixed;
      top: 40px;
      left: 24px;
      z-index: 400;
    }

    .keycap-symbol {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 3.5px;
      width: 38px;
      height: 38px;
      background: linear-gradient(180deg, #161619 0%, #0c0c0e 100%);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 10px;
      cursor: pointer;
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.12),
        0 4px 12px rgba(0, 0, 0, 0.7);
      transition:
        transform 120ms ease,
        border-color 140ms ease,
        background 140ms ease;
    }

    .keycap-symbol:hover {
      border-color: rgba(155, 229, 251, 0.4);
      background: linear-gradient(180deg, #1a1a1e 0%, #0e0e11 100%);
      transform: scale(1.05);
    }

    .keycap-symbol:active {
      transform: scale(0.96);
    }

    .icon-bar {
      width: 15px;
      height: 1.6px;
      background-color: #9be5fb;
      border-radius: 1px;
      transition: background-color 140ms ease;
    }

    /* =========================================
       TACTILE MECHANICAL DRAWER
       ========================================= */

    .ruler-drawer {
      position: fixed;
      top: 24px;
      bottom: 24px;
      left: 0;
      z-index: 290;
      width: 290px;
      height: calc(100vh - 48px);
      background: linear-gradient(180deg, #141416 0%, #0e0e11 100%);
      border: 1px solid rgba(255, 255, 255, 0.06);
      border-left: none;
      border-radius: 0 28px 28px 0;
      padding: 0 16px 0 24px;
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.05),
        0 8px 24px -4px rgba(0, 0, 0, 0.4);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      transform: translateX(-108%);
      opacity: 1;
      visibility: hidden;
      pointer-events: none;
      transition:
        transform 240ms var(--ease-out-slide),
        visibility 240ms step-end;
      will-change: transform;
    }

    .ruler-drawer.open {
      transform: translateX(0);
      opacity: 1;
      visibility: visible;
      pointer-events: auto;
      transition:
        transform 360ms var(--ease-in-glide),
        visibility 0ms;
    }

    /* Scrollable Container with Original Top Spacing & Mask */
    .ruler-list-wrap {
      flex: 1;
      overflow-y: auto;
      overscroll-behavior: contain;
      -webkit-overflow-scrolling: touch;
      display: flex;
      flex-direction: column;
      scrollbar-width: none;
      -ms-overflow-style: none;
      padding-top: 180px;
      padding-bottom: 120px;
      mask-image: linear-gradient(to bottom, transparent 0%, transparent 40px, black 120px, black calc(100% - 80px), transparent 100%);
      -webkit-mask-image: linear-gradient(to bottom, transparent 0%, transparent 40px, black 120px, black calc(100% - 80px), transparent 100%);
      position: relative;
    }

    .ruler-list-wrap::-webkit-scrollbar {
      display: none;
    }

    /* Brand Logo */
    .abyss-celestial-logo {
      display: inline-flex;
      color: #ffffff;
      opacity: 0.9;
      margin-bottom: 20px;
      padding-left: 4px;
    }

    /* Top Links */
    .top-links-group {
      display: flex;
      flex-direction: column;
      gap: 3px;
      margin-bottom: 18px;
    }

    .top-nav-link {
      display: flex;
      align-items: center;
      gap: 8px;
      height: 26px;
      padding: 0 4px;
      background: transparent;
      border: none;
      cursor: pointer;
      text-align: left;
      border-radius: 4px;
      transition: transform 140ms ease;
    }

    .top-nav-link .arrow-icon {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 14px;
      height: 14px;
      color: #52525b;
      transition: color 140ms ease, transform 140ms ease;
      flex-shrink: 0;
    }

    .top-nav-link .arrow-icon svg {
      width: 13px;
      height: 13px;
      stroke-width: 2.4;
    }

    .top-nav-link .label {
      font-size: 14px;
      font-weight: 600;
      letter-spacing: -0.01em;
      color: #a1a1aa;
      transition: color 140ms ease, transform 140ms ease;
    }

    .top-nav-link:hover .label {
      color: #9be5fb;
      transform: translateX(4px);
    }

    .top-nav-link:hover .arrow-icon {
      color: #9be5fb;
      transform: translate(2px, -2px);
    }

    .top-nav-link:active {
      transform: translateX(2px) scale(0.98);
    }

    /* Section Divider with Symmetrical Outward Photon Flare */
    .section-divider {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 0 4px;
      margin-bottom: 12px;
    }

    .section-divider .divider-line {
      flex: 1;
      height: 1px;
      background: rgba(255, 255, 255, 0.08);
      position: relative;
      overflow: hidden;
    }

    .section-divider .divider-line::after {
      content: "";
      position: absolute;
      top: 0;
      height: 100%;
      width: 48px;
      background: linear-gradient(90deg, transparent 0%, rgba(155, 229, 251, 0.85) 50%, transparent 100%);
      animation-duration: 3.4s;
      animation-timing-function: cubic-bezier(0.16, 1, 0.3, 1);
      animation-iteration-count: infinite;
    }

    .section-divider .line-left::after {
      right: -48px;
      animation-name: photonSweepLeft;
    }

    .section-divider .line-right::after {
      left: -48px;
      animation-name: photonSweepRight;
    }

    @keyframes photonSweepLeft {
      0% {
        transform: translateX(0);
        opacity: 0;
      }
      15% {
        opacity: 1;
      }
      65% {
        transform: translateX(-160px);
        opacity: 0;
      }
      100% {
        transform: translateX(-160px);
        opacity: 0;
      }
    }

    @keyframes photonSweepRight {
      0% {
        transform: translateX(0);
        opacity: 0;
      }
      15% {
        opacity: 1;
      }
      65% {
        transform: translateX(160px);
        opacity: 0;
      }
      100% {
        transform: translateX(160px);
        opacity: 0;
      }
    }

    .section-divider .divider-label {
      font-size: 10.5px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: #71717a;
    }

    .section-divider .divider-count {
      font-size: 10px;
      font-weight: 500;
      color: #52525b;
      margin-left: 2px;
    }

    /* Specimen Rows (Pure Clean CSS) */
    .nav-item {
      display: flex;
      align-items: baseline;
      height: 26px;
      padding: 0 4px;
      background: transparent;
      border: none;
      cursor: pointer;
      width: 100%;
      text-align: left;
      gap: 10px;
      flex-shrink: 0;
      transition: transform 140ms ease;
    }

    .nav-item .bracket {
      font-size: 13px;
      font-weight: 600;
      color: rgba(255, 255, 255, 0.28);
      letter-spacing: -0.02em;
      flex-shrink: 0;
      transition: color 100ms ease;
    }

    .nav-item .title {
      font-size: 14px;
      color: #8e8e93;
      letter-spacing: -0.01em;
      font-weight: 500;
      white-space: nowrap;
      transition: color 100ms ease, transform 140ms ease;
    }

    .nav-item:hover .bracket,
    .nav-item.active .bracket {
      color: #9be5fb;
    }

    .nav-item:hover .title {
      color: #ffffff;
      font-weight: 600;
      transform: translateX(4px);
    }

    .nav-item.active .title {
      color: #9be5fb;
      font-weight: 600;
    }

    .nav-item:active {
      transform: translateX(2px) scale(0.98);
    }
  </style>
</head>
<body>

  <div class="bg-grid"></div>

  <!-- Top-Left Menu Trigger Button -->
  <div class="top-left-menu">
    <button type="button" class="keycap-symbol" id="keycapBtn" title="Toggle Navigator">
      <span class="icon-bar"></span>
      <span class="icon-bar"></span>
      <span class="icon-bar"></span>
    </button>
  </div>

  <!-- RULER DRAWER HOUSING -->
  <aside class="ruler-drawer open" id="rulerDrawer">
    
    <!-- Scrollable Specimen List Container -->
    <div class="ruler-list-wrap" id="rulerListWrap">
      
      <!-- Brand Logo -->
      <div class="abyss-celestial-logo" aria-hidden="true">
        <svg width="24" height="24" viewBox="0 0 100 100" fill="currentColor">
          <path d="m50 7.5234 2.2461 29.645 5.9648-15.68-5.2891 24.566 0.089844 1.0898 37.09-22.633-27.855 22.355 20.266-5.3906-24.645 10.09 42.133 11.113-39.566-5.5469 21.109 12.812-25.188-11.445 15.898 34.777-19.363-30.055 3.1523 22.242-7.2656-24.844-21.031 32.656 14.41-31.531-16.945 14.586 17.043-19.578-42.254 5.9141 36.457-9.6016-24.191-3.6328 29.801 0.89844-32.168-25.82 28.945 17.656-11.887-17.145 19.934 22.055 0.097656 0.066406z" fill-rule="evenodd" />
        </svg>
      </div>

      <!-- Top Primary Navigation Links -->
      <div class="top-links-group">
        <button type="button" class="top-nav-link" id="linkCollection">
          <span class="arrow-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><line x1="7" y1="17" x2="17" y2="7"></line><polyline points="7 7 17 7 17 17"></polyline></svg>
          </span>
          <span class="label">Collection</span>
        </button>
        <button type="button" class="top-nav-link" id="linkDocs">
          <span class="arrow-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><line x1="7" y1="17" x2="17" y2="7"></line><polyline points="7 7 17 7 17 17"></polyline></svg>
          </span>
          <span class="label">Documentation</span>
        </button>
        <button type="button" class="top-nav-link" id="linkChangelog">
          <span class="arrow-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><line x1="7" y1="17" x2="17" y2="7"></line><polyline points="7 7 17 7 17 17"></polyline></svg>
          </span>
          <span class="label">Changelog</span>
        </button>
      </div>

      <!-- Section Divider: COLLECTION -->
      <div class="section-divider">
        <div class="divider-line line-left"></div>
        <span class="divider-label">Collection</span>
        <div class="divider-line line-right"></div>
      </div>

      <!-- Specimen Container -->
      <div id="itemsContainer" style="display: flex; flex-direction: column; gap: 0px;"></div>

    </div>

  </aside>

  <script>
    const SPECIMENS = [
      { num: "01", label: "3d Shatter Sphere", slug: "3d-shatter-sphere" },
      { num: "02", label: "Abyss Cursor Fall", slug: "abyss-cursor-fall" },
      { num: "03", label: "Bas-Relief Emboss", slug: "acg-fleece" },
      { num: "04", label: "Bronze Patina", slug: "bronze-transmutation" },
      { num: "05", label: "Cascade Gallery", slug: "cascade-gallery", active: true },
      { num: "06", label: "Chromepunk Normal Map", slug: "chromepunk-beast" },
      { num: "07", label: "Clip Morph", slug: "clip-morph" },
      { num: "08", label: "Curved Scroll Wipe", slug: "curved-scroll-wipe" },
      { num: "09", label: "Cylinder Scroll", slug: "cylinder-scroll" },
      { num: "10", label: "Depth Silhouette", slug: "depth-silhouette" },
      { num: "11", label: "Depth Swim", slug: "depth-swim" },
      { num: "12", label: "Dual Wave", slug: "dual-wave" },
      { num: "13", label: "Erosion Map", slug: "erosion-map" },
      { num: "14", label: "Gimbal Stream", slug: "gimbal-stream" },
      { num: "15", label: "Gold Gilding", slug: "gilding-transmutation" },
      { num: "16", label: "Gravity Cursor", slug: "gravity-cursor" },
      { num: "17", label: "Hover Media Stream", slug: "hover-media-stream" },
      { num: "18", label: "Image Snake Trail", slug: "image-snake-trail" },
      { num: "19", label: "Infrared Thermal", slug: "kinetic-portal" },
      { num: "20", label: "Knight Wind Banner", slug: "merlin-knights" },
      { num: "21", label: "Leonardo Sketch", slug: "japparii" },
      { num: "22", label: "Molten Mercury", slug: "molten-mercury" },
      { num: "23", label: "Parallax Bleed", slug: "parallax-bleed" },
      { num: "24", label: "Parallax Column", slug: "parallax-column" },
      { num: "25", label: "Pillar Gallery", slug: "accordion-wall" },
      { num: "26", label: "Procedural Atlas", slug: "procedural-atlas" },
      { num: "27", label: "Ripple Scramble", slug: "ripple-scramble" },
      { num: "28", label: "Steel Intaglio", slug: "steel-intaglio" },
      { num: "29", label: "Stone Bas-Relief", slug: "bas-relief-shadow" },
      { num: "30", label: "Tracklist Gallery", slug: "tracklist-gallery" },
      { num: "31", label: "Water Ripple", slug: "core-shell-b" }
    ];

    const drawer = document.getElementById("rulerDrawer");
    const keycapBtn = document.getElementById("keycapBtn");
    const container = document.getElementById("itemsContainer");
    const listWrap = document.getElementById("rulerListWrap");

    let isOpen = true;

    function toggleDrawer(open) {
      isOpen = (open !== undefined) ? open : !isOpen;
      if (isOpen) {
        drawer.classList.add("open");
        autoCenterActive();
      } else {
        drawer.classList.remove("open");
      }
    }

    keycapBtn.addEventListener("click", () => toggleDrawer());
    
    // Click outside to close
    window.addEventListener("click", (e) => {
      if (isOpen && !drawer.contains(e.target) && !keycapBtn.contains(e.target)) {
        toggleDrawer(false);
      }
    });

    window.addEventListener("keydown", (e) => {
      if (e.key === "Escape" && isOpen) toggleDrawer(false);
    });

    function autoCenterActive() {
      setTimeout(() => {
        const activeEl = container.querySelector(".nav-item.active");
        if (activeEl) {
          activeEl.scrollIntoView({ block: "center", behavior: "smooth" });
        }
      }, 60);
    }

    function renderList() {
      container.innerHTML = "";

      SPECIMENS.forEach((comp) => {
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = `nav-item ${comp.active ? "active" : ""}`;
        btn.innerHTML = `
          <span class="bracket">[${comp.num}]</span>
          <span class="title">${comp.label}</span>
        `;

        btn.addEventListener("click", () => {
          SPECIMENS.forEach(s => s.active = (s.slug === comp.slug));
          renderList();
        });

        container.appendChild(btn);
      });

      autoCenterActive();
    }

    renderList();

    // Wheel inertia (Butter-Smooth Exponential Spring)
    (function initSmoothScroll(el) {
      if (!el) return;
      let targetScroll = el.scrollTop;
      let currentScroll = el.scrollTop;
      let rafId = null;
      let lastTime = performance.now();

      const animate = (now) => {
        const deltaMs = Math.min(32, Math.max(1, now - lastTime));
        lastTime = now;

        const diff = targetScroll - currentScroll;
        if (Math.abs(diff) > 0.1) {
          const factor = 1 - Math.exp(-0.014 * deltaMs);
          currentScroll += diff * factor;
          el.scrollTop = currentScroll;
          rafId = requestAnimationFrame(animate);
        } else {
          currentScroll = targetScroll;
          el.scrollTop = targetScroll;
          rafId = null;
        }
      };

      el.addEventListener("wheel", (e) => {
        e.stopPropagation();
        e.preventDefault();

        const delta = Math.abs(e.deltaY) < 40 ? e.deltaY * 1.8 : e.deltaY * 0.85;
        const maxScroll = el.scrollHeight - el.clientHeight;
        targetScroll = Math.max(0, Math.min(maxScroll, (rafId ? targetScroll : currentScroll) + delta));
        lastTime = performance.now();

        if (rafId === null) {
          rafId = requestAnimationFrame(animate);
        }
      }, { passive: false });
    })(listWrap);
  </script>
</body>
</html>
