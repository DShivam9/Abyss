<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Abyss — 3D Celestial Logo: 10 Master Metamaterial Shaders</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #09090c;
      color: #ededee;
      font-family: 'Plus Jakarta Sans', -apple-system, sans-serif;
      user-select: none;
    }
    #canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      cursor: grab;
    }
    #canvas:active {
      cursor: grabbing;
    }

    /* Minimal Top-Right Dropdown */
    .dropdown-container {
      position: absolute;
      top: 24px;
      right: 28px;
      z-index: 30;
      user-select: none;
    }
    .dropdown-trigger {
      display: flex;
      align-items: center;
      gap: 10px;
      background: rgba(14, 14, 18, 0.88);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 10px;
      padding: 8px 14px;
      color: #ededee;
      font-family: 'JetBrains Mono', monospace;
      font-size: 11.5px;
      font-weight: 500;
      letter-spacing: 0.02em;
      cursor: pointer;
      box-shadow: 0 12px 28px rgba(0, 0, 0, 0.8);
      transition: all 0.2s ease;
    }
    .dropdown-trigger:hover {
      background: rgba(22, 22, 28, 0.95);
      border-color: rgba(255, 255, 255, 0.2);
    }
    .dropdown-trigger span.active-name {
      color: #9be5fb;
      font-weight: 600;
    }
    .dropdown-trigger svg {
      width: 12px;
      height: 12px;
      stroke: #a1a1aa;
      transition: transform 0.2s ease;
    }
    .dropdown-container.open .dropdown-trigger svg {
      transform: rotate(180deg);
    }
    .dropdown-menu {
      position: absolute;
      top: calc(100% + 6px);
      right: 0;
      width: 250px;
      max-height: 380px;
      overflow-y: auto;
      background: rgba(14, 14, 18, 0.95);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 10px;
      padding: 5px;
      box-shadow: 0 16px 36px rgba(0, 0, 0, 0.9);
      display: none;
      flex-direction: column;
      gap: 2px;
    }
    .dropdown-menu::-webkit-scrollbar {
      width: 4px;
    }
    .dropdown-menu::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.18);
      border-radius: 2px;
    }
    .dropdown-container.open .dropdown-menu {
      display: flex;
    }
    .dropdown-item {
      padding: 8px 12px;
      border-radius: 6px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      color: #a1a1aa;
      cursor: pointer;
      transition: all 0.15s ease;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .dropdown-item:hover {
      background: rgba(255, 255, 255, 0.08);
      color: #ffffff;
    }
    .dropdown-item.active {
      background: #25252c;
      color: #9be5fb;
      font-weight: 600;
    }
    .dropdown-item.active::after {
      content: '✓';
      font-size: 10px;
      color: #9be5fb;
    }
  </style>
</head>
<body>

  <!-- Minimal Top-Right Dropdown Menu -->
  <div class="dropdown-container" id="dropdown">
    <div class="dropdown-trigger" onclick="toggleDropdown()">
      <span>Shader: <span class="active-name" id="selected-label">Prism Glass</span></span>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="6 9 12 15 18 9"></polyline>
      </svg>
    </div>
    <div class="dropdown-menu">
      <div class="dropdown-item active" onclick="selectShader(0, 'Prism Glass')">01: Prism Glass</div>
      <div class="dropdown-item" onclick="selectShader(1, 'Quantum Hologram')">02: Quantum Hologram</div>
      <div class="dropdown-item" onclick="selectShader(2, 'Liquid Chrome Hybrid')">03: Liquid Chrome Hybrid</div>
      <div class="dropdown-item" onclick="selectShader(3, 'Aurora Plasma')">04: Aurora Plasma</div>
      <div class="dropdown-item" onclick="selectShader(4, 'Thermal Heatmap')">05: Thermal Heatmap</div>
      <div class="dropdown-item" onclick="selectShader(5, 'Event Horizon Void')">06: Event Horizon Void</div>
      <div class="dropdown-item" onclick="selectShader(6, 'Obsidian & Palladium')">07: Obsidian & Palladium</div>
      <div class="dropdown-item" onclick="selectShader(7, 'Anisotropic Mercury')">08: Anisotropic Mercury</div>
      <div class="dropdown-item" onclick="selectShader(8, 'Caustic Star Diamond')">09: Caustic Star Diamond</div>
      <div class="dropdown-item" onclick="selectShader(9, 'Carbon & Molten Copper')">10: Carbon & Molten Copper</div>
    </div>
  </div>

  <canvas id="canvas"></canvas>

  <script>
    const canvas = document.getElementById('canvas');
    
    const camera = new THREE.PerspectiveCamera(34, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(0, 0, 9.5);

    const renderer = new THREE.WebGLRenderer({ 
      canvas, 
      antialias: true, 
      powerPreference: 'high-performance',
      precision: 'highp'
    });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.outputEncoding = THREE.sRGBEncoding;

    const backgroundScene = new THREE.Scene();
    const mainScene = new THREE.Scene();

    let renderTarget = new THREE.WebGLRenderTarget(
      window.innerWidth * Math.min(window.devicePixelRatio, 2),
      window.innerHeight * Math.min(window.devicePixelRatio, 2),
      {
        format: THREE.RGBAFormat,
        type: THREE.UnsignedByteType,
        minFilter: THREE.LinearFilter,
        magFilter: THREE.LinearFilter
      }
    );

    // =========================================================================
    // BACKGROUND RAW IMAGE PLANE (ZERO BORDERS, 1:1 RAW COLORS)
    // =========================================================================
    const textureLoader = new THREE.TextureLoader();
    const bgTexture = textureLoader.load('/images/components images/Image(shader)/chromium-queen.webp');
    bgTexture.encoding = THREE.sRGBEncoding;
    bgTexture.generateMipmaps = true;
    bgTexture.minFilter = THREE.LinearMipmapLinearFilter;

    const imgWidth = 5.6;
    const imgHeight = 3.6;

    const bgPlaneGeom = new THREE.PlaneGeometry(imgWidth, imgHeight);
    const bgPlaneMat = new THREE.MeshBasicMaterial({
      map: bgTexture,
      side: THREE.DoubleSide
    });
    const bgPlane = new THREE.Mesh(bgPlaneGeom, bgPlaneMat);
    bgPlane.position.set(0, 0, -1.0);
    backgroundScene.add(bgPlane);

    // =========================================================================
    // 1:1 SVG VECTOR PATH (EXACT GEOMETRY PRESERVED)
    // =========================================================================
    function createCleanAbyssLogoShape() {
      const relCommands = [
        [50, 7.5234],
        [2.2461, 29.645],
        [5.9648, -15.68],
        [-5.2891, 24.566],
        [0.089844, 1.0898],
        [37.09, -22.633],
        [-27.855, 22.355],
        [20.266, -5.3906],
        [-24.645, 10.09],
        [42.133, 11.113],
        [-39.566, -5.5469],
        [21.109, 12.812],
        [-25.188, -11.445],
        [15.898, 34.777],
        [-19.363, -30.055],
        [3.1523, 22.242],
        [-7.2656, -24.844],
        [-21.031, 32.656],
        [14.41, -31.531],
        [-16.945, 14.586],
        [17.043, -19.578],
        [-42.254, 5.9141],
        [36.457, -9.6016],
        [-24.191, -3.6328],
        [29.801, 0.89844],
        [-32.168, -25.82],
        [28.945, 17.656],
        [-11.887, -17.145],
        [19.934, 22.055],
        [0.097656, 0.066406]
      ];

      const scale = 0.046;
      const shape = new THREE.Shape();
      let curX = relCommands[0][0];
      let curY = relCommands[0][1];

      shape.moveTo((curX - 50) * scale, -(curY - 50) * scale);

      for (let i = 1; i < relCommands.length; i++) {
        curX += relCommands[i][0];
        curY += relCommands[i][1];
        shape.lineTo((curX - 50) * scale, -(curY - 50) * scale);
      }

      shape.closePath();
      return shape;
    }

    const logoShape = createCleanAbyssLogoShape();

    const extrudeSettings = {
      steps: 1,
      depth: 0.18,
      bevelEnabled: true,
      bevelThickness: 0.20,
      bevelSize: 0.14,
      bevelSegments: 16,
      curveSegments: 32
    };

    const geometry = new THREE.ExtrudeGeometry(logoShape, extrudeSettings);
    geometry.center();
    geometry.computeVertexNormals();

    const logoGroup = new THREE.Group();
    mainScene.add(logoGroup);

    // =========================================================================
    // 10 MASTER GLSL SHADERS (6 GLASS/VOID + 4 LUXURY METAMATERIALS)
    // =========================================================================
    const globalUniforms = {
      uSceneTexture: { value: renderTarget.texture },
      uResolution: { value: new THREE.Vector2(window.innerWidth, window.innerHeight) },
      uTime: { value: 0.0 },
      uRefractPower: { value: 0.12 },
      uChromaticDispersion: { value: 0.025 },
      uIceColor: { value: new THREE.Color(0x9be5fb) }
    };

    const commonVertex = `
      varying vec3 vWorldNormal;
      varying vec3 vWorldPosition;
      varying vec3 vViewDirection;

      void main() {
        vec4 worldPos = modelMatrix * vec4(position, 1.0);
        vWorldPosition = worldPos.xyz;
        vWorldNormal = normalize(mat3(modelMatrix) * normal);
        vViewDirection = normalize(cameraPosition - worldPos.xyz);
        gl_Position = projectionMatrix * viewMatrix * worldPos;
      }
    `;

    // 01: PRISM OPTICAL GLASS
    const shaderPrism = new THREE.ShaderMaterial({
      uniforms: globalUniforms,
      vertexShader: commonVertex,
      fragmentShader: `
        uniform sampler2D uSceneTexture;
        uniform vec2 uResolution;
        uniform float uRefractPower;
        uniform float uChromaticDispersion;
        uniform vec3 uIceColor;

        varying vec3 vWorldNormal;
        varying vec3 vViewDirection;

        void main() {
          vec2 screenUV = gl_FragCoord.xy / uResolution;
          vec3 normal = normalize(vWorldNormal);
          vec3 viewDir = normalize(vViewDirection);

          float NdotV = max(dot(normal, viewDir), 0.0);
          float fresnel = pow(1.0 - NdotV, 3.0);

          vec2 refractOffset = normal.xy * uRefractPower;

          float r = texture2D(uSceneTexture, screenUV + refractOffset * (1.0 + uChromaticDispersion * 2.0)).r;
          float g = texture2D(uSceneTexture, screenUV + refractOffset).g;
          float b = texture2D(uSceneTexture, screenUV + refractOffset * (1.0 - uChromaticDispersion * 2.0)).b;
          vec3 refractedColor = vec3(r, g, b);

          vec3 tintedColor = mix(refractedColor, uIceColor, 0.15);
          vec3 finalColor = tintedColor + vec3(fresnel * 0.7) + uIceColor * (fresnel * 0.4);

          gl_FragColor = vec4(finalColor, 1.0);
        }
      `,
      transparent: true,
      side: THREE.DoubleSide
    });

    // 02: QUANTUM HOLOGRAM
    const shaderHologram = new THREE.ShaderMaterial({
      uniforms: globalUniforms,
      vertexShader: commonVertex,
      fragmentShader: `
        uniform sampler2D uSceneTexture;
        uniform vec2 uResolution;
        uniform float uTime;
        uniform float uRefractPower;

        varying vec3 vWorldNormal;
        varying vec3 vViewDirection;

        vec3 spectralPalette(float t) {
          vec3 a = vec3(0.5, 0.5, 0.5);
          vec3 b = vec3(0.5, 0.5, 0.5);
          vec3 c = vec3(1.0, 1.0, 1.0);
          vec3 d = vec3(0.0, 0.33, 0.67);
          return a + b * cos(6.28318 * (c * t + d));
        }

        void main() {
          vec2 screenUV = gl_FragCoord.xy / uResolution;
          vec3 normal = normalize(vWorldNormal);
          vec3 viewDir = normalize(vViewDirection);

          float NdotV = max(dot(normal, viewDir), 0.0);
          float fresnel = pow(1.0 - NdotV, 2.0);

          vec2 refractOffset = normal.xy * uRefractPower;
          vec3 refractedColor = texture2D(uSceneTexture, screenUV + refractOffset).rgb;

          float filmWave = (1.0 - NdotV) * 2.5 + dot(normal.xy, vec2(1.0)) * 0.5 + sin(uTime * 0.8) * 0.2;
          vec3 iridColor = spectralPalette(filmWave) * fresnel;

          vec3 finalColor = mix(refractedColor, iridColor, 0.45) + iridColor * 0.6 + vec3(fresnel * 0.4);
          gl_FragColor = vec4(finalColor, 1.0);
        }
      `,
      transparent: true,
      side: THREE.DoubleSide
    });

    // 03: LIQUID CHROME HYBRID
    const shaderChromeHybrid = new THREE.ShaderMaterial({
      uniforms: globalUniforms,
      vertexShader: commonVertex,
      fragmentShader: `
        uniform sampler2D uSceneTexture;
        uniform vec2 uResolution;
        uniform float uRefractPower;
        uniform vec3 uIceColor;

        varying vec3 vWorldNormal;
        varying vec3 vViewDirection;

        void main() {
          vec2 screenUV = gl_FragCoord.xy / uResolution;
          vec3 normal = normalize(vWorldNormal);
          vec3 viewDir = normalize(vViewDirection);

          float NdotV = max(dot(normal, viewDir), 0.0);
          float fresnel = pow(1.0 - NdotV, 2.2);

          vec2 refractOffset = normal.xy * (uRefractPower * 1.4);
          vec3 refractedColor = texture2D(uSceneTexture, screenUV + refractOffset).rgb;

          vec3 chromeReflection = vec3(fresnel * 1.5) + uIceColor * (fresnel * 0.4);
          vec3 finalColor = mix(refractedColor, chromeReflection, smoothstep(0.25, 0.85, fresnel));
          finalColor += vec3(fresnel * 0.35);

          gl_FragColor = vec4(finalColor, 1.0);
        }
      `,
      transparent: true,
      side: THREE.DoubleSide
    });

    // 04: AURORA PLASMA
    const shaderAurora = new THREE.ShaderMaterial({
      uniforms: globalUniforms,
      vertexShader: commonVertex,
      fragmentShader: `
        uniform sampler2D uSceneTexture;
        uniform vec2 uResolution;
        uniform float uTime;
        uniform float uRefractPower;

        varying vec3 vWorldNormal;
        varying vec3 vWorldPosition;
        varying vec3 vViewDirection;

        void main() {
          vec2 screenUV = gl_FragCoord.xy / uResolution;
          vec3 normal = normalize(vWorldNormal);
          vec3 viewDir = normalize(vViewDirection);

          float NdotV = max(dot(normal, viewDir), 0.0);
          float fresnel = pow(1.0 - NdotV, 2.5);

          vec2 refractOffset = normal.xy * uRefractPower;
          vec3 refractedColor = texture2D(uSceneTexture, screenUV + refractOffset).rgb;

          float wave1 = sin(vWorldPosition.x * 6.0 + uTime * 2.0 + vWorldPosition.y * 4.0);
          float wave2 = cos(vWorldPosition.y * 8.0 - uTime * 1.5 + vWorldPosition.z * 5.0);
          float wave = (wave1 + wave2) * 0.5;

          vec3 cEmerald = vec3(0.1, 0.95, 0.65);
          vec3 cCyan = vec3(0.3, 0.8, 1.0);
          vec3 cMagenta = vec3(0.9, 0.2, 0.7);

          vec3 auroraCol = mix(cEmerald, cCyan, wave * 0.5 + 0.5);
          auroraCol = mix(auroraCol, cMagenta, smoothstep(0.3, 0.9, wave));

          vec3 finalColor = mix(refractedColor, auroraCol, 0.35) + auroraCol * (fresnel * 0.8);
          gl_FragColor = vec4(finalColor, 1.0);
        }
      `,
      transparent: true,
      side: THREE.DoubleSide
    });

    // 05: THERMAL HEATMAP SPECTRUM
    const shaderHeatmap = new THREE.ShaderMaterial({
      uniforms: globalUniforms,
      vertexShader: commonVertex,
      fragmentShader: `
        uniform float uTime;
        varying vec3 vWorldNormal;
        varying vec3 vWorldPosition;
        varying vec3 vViewDirection;

        vec3 thermalGradient(float t) {
          vec3 c1 = vec3(0.05, 0.08, 0.18);
          vec3 c2 = vec3(0.05, 0.85, 0.95);
          vec3 c3 = vec3(0.98, 0.55, 0.15);
          vec3 c4 = vec3(1.0, 1.0, 1.0);
          if (t < 0.33) return mix(c1, c2, t / 0.33);
          if (t < 0.66) return mix(c2, c3, (t - 0.33) / 0.33);
          return mix(c3, c4, (t - 0.66) / 0.34);
        }

        void main() {
          vec3 normal = normalize(vWorldNormal);
          vec3 viewDir = normalize(vViewDirection);
          float NdotV = max(dot(normal, viewDir), 0.0);
          float heat = (1.0 - NdotV) * 0.8 + (normal.y * 0.5 + 0.5) * 0.3 + sin(vWorldPosition.z * 10.0 + uTime) * 0.1;
          heat = clamp(heat, 0.0, 1.0);
          gl_FragColor = vec4(thermalGradient(heat), 1.0);
        }
      `,
      side: THREE.DoubleSide
    });

    // 06: EVENT HORIZON VOID
    const shaderVoid = new THREE.ShaderMaterial({
      uniforms: globalUniforms,
      vertexShader: commonVertex,
      fragmentShader: `
        uniform vec3 uIceColor;
        varying vec3 vWorldNormal;
        varying vec3 vViewDirection;

        void main() {
          vec3 normal = normalize(vWorldNormal);
          vec3 viewDir = normalize(vViewDirection);
          float NdotV = max(dot(normal, viewDir), 0.0);
          float rim = pow(1.0 - NdotV, 6.0);
          vec3 rimColor = mix(uIceColor, vec3(1.0), 0.6) * rim * 2.8;
          vec3 finalColor = vec3(0.015, 0.015, 0.02) + rimColor;
          gl_FragColor = vec4(finalColor, 1.0);
        }
      `,
      side: THREE.DoubleSide
    });

    // =========================================================================
    // 4 NEW LUXURY METAMATERIAL SHADERS
    // =========================================================================

    // 07: MACHINED OBSIDIAN & PALLADIUM (Matte PVD with Razor Mirror Chamfers)
    const shaderObsidianPalladium = new THREE.ShaderMaterial({
      uniforms: globalUniforms,
      vertexShader: commonVertex,
      fragmentShader: `
        varying vec3 vWorldNormal;
        varying vec3 vWorldPosition;
        varying vec3 vViewDirection;

        void main() {
          vec3 normal = normalize(vWorldNormal);
          vec3 viewDir = normalize(vViewDirection);
          vec3 lightDir = normalize(vec3(0.5, 0.8, 0.6));
          vec3 rimLightDir = normalize(vec3(-0.6, -0.4, 0.5));

          float NdotV = max(dot(normal, viewDir), 0.0);
          float diff = max(dot(normal, lightDir), 0.0);
          float rimDiff = max(dot(normal, rimLightDir), 0.0);

          // Matte brushed PVD Titanium body
          vec3 pvdMatte = vec3(0.07, 0.07, 0.08) + vec3(diff * 0.05 + rimDiff * 0.03);

          // Mirror Palladium bevel highlight
          vec3 halfVec = normalize(lightDir + viewDir);
          float spec = pow(max(dot(normal, halfVec), 0.0), 40.0);
          float bevelGlint = pow(1.0 - NdotV, 4.0);

          vec3 palladium = vec3(0.92, 0.94, 0.98) * (spec * 1.8 + bevelGlint * 1.2);

          vec3 finalColor = mix(pvdMatte, palladium, smoothstep(0.3, 0.9, bevelGlint));
          gl_FragColor = vec4(finalColor, 1.0);
        }
      `,
      side: THREE.DoubleSide
    });

    // 08: LIQUID ANISOTROPIC MERCURY (Smooth Anisotropic Metallic Sheen)
    const shaderMercury = new THREE.ShaderMaterial({
      uniforms: globalUniforms,
      vertexShader: commonVertex,
      fragmentShader: `
        uniform float uTime;
        uniform vec3 uIceColor;
        varying vec3 vWorldNormal;
        varying vec3 vWorldPosition;
        varying vec3 vViewDirection;

        void main() {
          vec3 normal = normalize(vWorldNormal);
          vec3 viewDir = normalize(vViewDirection);
          vec3 lightDir = normalize(vec3(sin(uTime * 0.4), 0.8, cos(uTime * 0.4)));

          float NdotV = max(dot(normal, viewDir), 0.0);
          float fresnel = pow(1.0 - NdotV, 2.5);

          // Anisotropic radial tangent highlight
          vec3 tangent = normalize(cross(normal, vec3(0.0, 1.0, 0.0)));
          vec3 halfVec = normalize(lightDir + viewDir);
          float dotTH = dot(tangent, halfVec);
          float aniso = sqrt(1.0 - dotTH * dotTH);
          float anisoSpec = pow(max(aniso, 0.0), 16.0);

          vec3 mercuryBase = vec3(0.65, 0.68, 0.74);
          vec3 mercuryReflect = mix(mercuryBase, vec3(1.0), anisoSpec * 0.7);
          vec3 finalColor = mercuryReflect + uIceColor * (fresnel * 0.6) + vec3(anisoSpec * 0.5);

          gl_FragColor = vec4(finalColor, 1.0);
        }
      `,
      side: THREE.DoubleSide
    });

    // 09: TRAPPED CAUSTIC STAR DIAMOND (Smoked Crystal + Internal Caustic Lightweb)
    const shaderCausticDiamond = new THREE.ShaderMaterial({
      uniforms: globalUniforms,
      vertexShader: commonVertex,
      fragmentShader: `
        uniform sampler2D uSceneTexture;
        uniform vec2 uResolution;
        uniform float uTime;
        uniform float uRefractPower;
        uniform vec3 uIceColor;

        varying vec3 vWorldNormal;
        varying vec3 vWorldPosition;
        varying vec3 vViewDirection;

        float causticWeb(vec2 p) {
          vec2 p1 = p * 12.0;
          float c1 = sin(p1.x + uTime * 2.0) + sin(p1.y + uTime * 1.5);
          float c2 = cos(p1.x * 0.8 - uTime * 1.8) + cos(p1.y * 1.2 + uTime * 2.2);
          return pow(abs(c1 + c2) * 0.25, 3.0);
        }

        void main() {
          vec2 screenUV = gl_FragCoord.xy / uResolution;
          vec3 normal = normalize(vWorldNormal);
          vec3 viewDir = normalize(vViewDirection);

          float NdotV = max(dot(normal, viewDir), 0.0);
          float fresnel = pow(1.0 - NdotV, 3.0);

          vec2 refractOffset = normal.xy * (uRefractPower * 1.1);
          vec3 refractedColor = texture2D(uSceneTexture, screenUV + refractOffset).rgb;

          // Internal caustic aquatic lightwebs
          float caustic = causticWeb(vWorldPosition.xy + normal.xy * 0.2);
          vec3 causticLight = mix(uIceColor, vec3(1.0), 0.5) * caustic * 1.6;

          // Smoked deep crystal transmission
          vec3 smokedGlass = mix(refractedColor * 0.4, vec3(0.02, 0.03, 0.05), 0.3);
          vec3 finalColor = smokedGlass + causticLight + vec3(fresnel * 0.8);

          gl_FragColor = vec4(finalColor, 1.0);
        }
      `,
      transparent: true,
      side: THREE.DoubleSide
    });

    // 10: FORGED CARBON & MOLTEN COPPER (Textured Carbon Slab with Molten Copper Leaf)
    const shaderCarbonCopper = new THREE.ShaderMaterial({
      uniforms: globalUniforms,
      vertexShader: commonVertex,
      fragmentShader: `
        uniform float uTime;
        varying vec3 vWorldNormal;
        varying vec3 vWorldPosition;
        varying vec3 vViewDirection;

        void main() {
          vec3 normal = normalize(vWorldNormal);
          vec3 viewDir = normalize(vViewDirection);
          vec3 lightDir = normalize(vec3(0.7, 0.8, 0.4));

          float NdotV = max(dot(normal, viewDir), 0.0);
          float diff = max(dot(normal, lightDir), 0.0);
          float bevel = pow(1.0 - NdotV, 3.5);

          // Forged carbon fiber undulating texture
          float carbonGrain = sin(vWorldPosition.x * 40.0 + sin(vWorldPosition.y * 30.0) * 4.0);
          float carbonShimmer = smoothstep(-0.2, 0.8, carbonGrain) * 0.15;
          vec3 carbonBody = vec3(0.04, 0.04, 0.05) + vec3(diff * 0.08) + vec3(carbonShimmer);

          // Molten copper / gold leaf veins on edges
          float copperPulse = sin(uTime * 2.0 + vWorldPosition.y * 8.0) * 0.15 + 0.85;
          vec3 copperGold = vec3(0.98, 0.58, 0.22) * copperPulse * 1.5;

          vec3 finalColor = mix(carbonBody, copperGold, smoothstep(0.4, 0.95, bevel));
          gl_FragColor = vec4(finalColor, 1.0);
        }
      `,
      side: THREE.DoubleSide
    });

    const shaderList = [
      shaderPrism,
      shaderHologram,
      shaderChromeHybrid,
      shaderAurora,
      shaderHeatmap,
      shaderVoid,
      shaderObsidianPalladium,
      shaderMercury,
      shaderCausticDiamond,
      shaderCarbonCopper
    ];

    const mainMesh = new THREE.Mesh(geometry, shaderList[0]);
    logoGroup.add(mainMesh);

    // =========================================================================
    // DROPDOWN INTERACTION
    // =========================================================================
    const dropdown = document.getElementById('dropdown');
    const selectedLabel = document.getElementById('selected-label');

    function toggleDropdown() {
      dropdown.classList.toggle('open');
    }

    document.addEventListener('click', (e) => {
      if (!dropdown.contains(e.target)) {
        dropdown.classList.remove('open');
      }
    });

    function selectShader(index, name) {
      document.querySelectorAll('.dropdown-item').forEach((item, i) => {
        item.classList.toggle('active', i === index);
      });
      selectedLabel.innerText = name;
      mainMesh.material = shaderList[index];
      dropdown.classList.remove('open');
    }

    // =========================================================================
    // 2D DRAGGING & CINEMATIC DRAMATIC AUTO-ROTATION
    // =========================================================================
    let isDraggingPos = false;
    let isDraggingRot = false;
    let prevMouse = { x: 0, y: 0 };
    let targetPos = { x: 0, y: 0 };
    let manualRot = { x: 0, y: 0 };

    const planeZ = new THREE.Plane(new THREE.Vector3(0, 0, 1), 0);
    const raycaster = new THREE.Raycaster();
    const mouseVec = new THREE.Vector2();
    const planeIntersection = new THREE.Vector3();

    function getMouseWorldPos(e) {
      mouseVec.x = (e.clientX / window.innerWidth) * 2 - 1;
      mouseVec.y = -(e.clientY / window.innerHeight) * 2 + 1;
      raycaster.setFromCamera(mouseVec, camera);
      raycaster.ray.intersectPlane(planeZ, planeIntersection);
      return planeIntersection;
    }

    canvas.addEventListener('mousedown', (e) => {
      if (e.button === 2 || e.altKey) {
        isDraggingRot = true;
      } else {
        isDraggingPos = true;
        const worldPos = getMouseWorldPos(e);
        targetPos.x = worldPos.x;
        targetPos.y = worldPos.y;
      }
      prevMouse.x = e.clientX;
      prevMouse.y = e.clientY;
    });

    window.addEventListener('contextmenu', (e) => e.preventDefault());

    window.addEventListener('mouseup', () => {
      isDraggingPos = false;
      isDraggingRot = false;
    });

    window.addEventListener('mousemove', (e) => {
      if (isDraggingPos) {
        const worldPos = getMouseWorldPos(e);
        targetPos.x = worldPos.x;
        targetPos.y = worldPos.y;
      } else if (isDraggingRot) {
        const dx = e.clientX - prevMouse.x;
        const dy = e.clientY - prevMouse.y;
        manualRot.y += dx * 0.01;
        manualRot.x += dy * 0.01;
      }
      prevMouse.x = e.clientX;
      prevMouse.y = e.clientY;
    });

    // Touch support
    canvas.addEventListener('touchstart', (e) => {
      if (e.touches.length === 1) {
        isDraggingPos = true;
        const t = e.touches[0];
        const worldPos = getMouseWorldPos(t);
        targetPos.x = worldPos.x;
        targetPos.y = worldPos.y;
        prevMouse.x = t.clientX;
        prevMouse.y = t.clientY;
      }
    });

    window.addEventListener('touchend', () => {
      isDraggingPos = false;
    });

    window.addEventListener('touchmove', (e) => {
      if (!isDraggingPos || e.touches.length !== 1) return;
      const t = e.touches[0];
      const worldPos = getMouseWorldPos(t);
      targetPos.x = worldPos.x;
      targetPos.y = worldPos.y;
    });

    const clock = new THREE.Clock();

    function animate() {
      requestAnimationFrame(animate);
      const elapsed = clock.getElapsedTime();
      globalUniforms.uTime.value = elapsed;

      // CINEMATIC & DRAMATIC MULTI-AXIS ORBIT
      const autoYaw = elapsed * 0.45;
      const autoPitch = Math.sin(elapsed * 0.7) * 0.38 + Math.cos(elapsed * 0.35) * 0.15;
      const autoRoll = Math.sin(elapsed * 0.5) * 0.22;

      const targetRotX = autoPitch + manualRot.x;
      const targetRotY = autoYaw + manualRot.y;
      const targetRotZ = autoRoll;

      logoGroup.position.x += (targetPos.x - logoGroup.position.x) * 0.12;
      logoGroup.position.y += (targetPos.y - logoGroup.position.y) * 0.12;

      logoGroup.rotation.x += (targetRotX - logoGroup.rotation.x) * 0.08;
      logoGroup.rotation.y += (targetRotY - logoGroup.rotation.y) * 0.08;
      logoGroup.rotation.z += (targetRotZ - logoGroup.rotation.z) * 0.08;

      // PASS 1: Render background scene into RenderTarget texture
      renderer.setRenderTarget(renderTarget);
      renderer.render(backgroundScene, camera);

      // PASS 2: Render main scene with active shader
      renderer.setRenderTarget(null);
      renderer.render(backgroundScene, camera);
      renderer.autoClear = false;
      renderer.render(mainScene, camera);
      renderer.autoClear = true;
    }

    animate();

    window.addEventListener('resize', () => {
      const w = window.innerWidth;
      const h = window.innerHeight;
      camera.aspect = w / h;
      camera.updateProjectionMatrix();
      renderer.setSize(w, h);
      
      renderTarget.setSize(
        w * Math.min(window.devicePixelRatio, 2),
        h * Math.min(window.devicePixelRatio, 2)
      );
      globalUniforms.uResolution.value.set(w, h);
    });
  </script>
</body>
</html>
