<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Abyss — 3D Celestial Logo: Pure Liquid Mirror Mercury</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #020204;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    #canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
    }
    .hud {
      position: absolute;
      top: 24px;
      left: 28px;
      color: #ffffff;
      font-size: 11px;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      pointer-events: none;
      z-index: 10;
      opacity: 0.95;
    }
    .hud span {
      color: #6b7280;
      margin-left: 8px;
    }
    .controls-panel {
      position: absolute;
      bottom: 24px;
      left: 28px;
      display: flex;
      gap: 8px;
      z-index: 10;
    }
    .btn {
      background: rgba(18, 18, 18, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: #e5e7eb;
      padding: 6px 14px;
      font-size: 11px;
      letter-spacing: 0.08em;
      border-radius: 4px;
      cursor: pointer;
      backdrop-filter: blur(8px);
      transition: all 0.2s;
    }
    .btn:hover, .btn.active {
      border-color: #ffffff;
      color: #ffffff;
      background: rgba(35, 35, 35, 1.0);
    }
  </style>
</head>
<body>
  <div class="hud">ABYSS CELESTIAL LOGO // <span>TRUE LIQUID MIRROR MERCURY &bull; DRAG TO ORBIT</span></div>
  
  <div class="controls-panel">
    <button class="btn" id="btn-front">FRONT VIEW</button>
    <button class="btn" id="btn-side">SIDE VIEW</button>
    <button class="btn" id="btn-persp">3/4 ANGLE</button>
    <button class="btn" id="btn-wire">TOGGLE WIREFRAME</button>
    <button class="btn" id="btn-spin">TOGGLE SLOW DRIFT</button>
  </div>

  <canvas id="canvas"></canvas>

  <script>
    const canvas = document.getElementById('canvas');
    const scene = new THREE.Scene();
    
    const camera = new THREE.PerspectiveCamera(34, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(0, 0, 10);
    scene.add(camera);

    const renderer = new THREE.WebGLRenderer({ 
      canvas, 
      antialias: true, 
      powerPreference: 'high-performance',
      precision: 'highp'
    });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.25;

    const controls = new THREE.OrbitControls(camera, canvas);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;
    controls.minDistance = 2.5;
    controls.maxDistance = 20;

    // --- Dynamic Camera-Mounted Key Lights ---
    const camKey = new THREE.DirectionalLight(0xffffff, 2.2);
    camKey.position.set(0, 4, 7);
    camera.add(camKey);

    const camRim = new THREE.DirectionalLight(0xffffff, 1.5);
    camRim.position.set(0, -4, 5);
    camera.add(camRim);

    const ambLight = new THREE.AmbientLight(0xffffff, 0.5);
    scene.add(ambLight);

    // =========================================================================
    // HIGH-CONTRAST STUDIO LIQUID MERCURY ENVIRONMENT
    // =========================================================================
    function createLiquidMercuryStudioEnvironment() {
      const envScene = new THREE.Scene();
      
      const envGeo = new THREE.SphereGeometry(90, 32, 16);
      const envMat = new THREE.MeshBasicMaterial({ color: 0x050508, side: THREE.BackSide });
      envScene.add(new THREE.Mesh(envGeo, envMat));

      const topSoftbox = new THREE.Mesh(
        new THREE.CircleGeometry(50, 24),
        new THREE.MeshBasicMaterial({ color: 0xffffff, side: THREE.DoubleSide })
      );
      topSoftbox.position.set(0, 60, 0);
      topSoftbox.rotation.x = Math.PI / 2;
      envScene.add(topSoftbox);

      for (let i = 0; i < 6; i++) {
        const angle = (i / 6) * Math.PI * 2;
        const bar = new THREE.Mesh(
          new THREE.PlaneGeometry(28, 95),
          new THREE.MeshBasicMaterial({ color: 0xffffff, side: THREE.DoubleSide })
        );
        bar.position.set(Math.cos(angle) * 55, (i % 2 === 0 ? 15 : -15), Math.sin(angle) * 55);
        bar.lookAt(0, 0, 0);
        envScene.add(bar);
      }

      const horizStrip = new THREE.Mesh(
        new THREE.RingGeometry(45, 52, 32),
        new THREE.MeshBasicMaterial({ color: 0xffffff, side: THREE.DoubleSide })
      );
      horizStrip.position.set(0, 0, 0);
      horizStrip.rotation.x = Math.PI / 2;
      envScene.add(horizStrip);

      const pmremGen = new THREE.PMREMGenerator(renderer);
      const envMap = pmremGen.fromScene(envScene, 0.04).texture;
      pmremGen.dispose();
      return envMap;
    }

    const studioEnvMap = createLiquidMercuryStudioEnvironment();
    scene.environment = studioEnvMap;

    // =========================================================================
    // 1:1 SVG VECTOR PATH
    // =========================================================================
    function createCleanAbyssLogoShape() {
      const relCommands = [
        [50, 7.5234],
        [2.2461, 29.645],
        [5.9648, -15.68],
        [-5.2891, 24.566],
        [0.089844, 1.0898],
        [37.09, -22.633],
        [-27.855, 22.355],
        [20.266, -5.3906],
        [-24.645, 10.09],
        [42.133, 11.113],
        [-39.566, -5.5469],
        [21.109, 12.812],
        [-25.188, -11.445],
        [15.898, 34.777],
        [-19.363, -30.055],
        [3.1523, 22.242],
        [-7.2656, -24.844],
        [-21.031, 32.656],
        [14.41, -31.531],
        [-16.945, 14.586],
        [17.043, -19.578],
        [-42.254, 5.9141],
        [36.457, -9.6016],
        [-24.191, -3.6328],
        [29.801, 0.89844],
        [-32.168, -25.82],
        [28.945, 17.656],
        [-11.887, -17.145],
        [19.934, 22.055],
        [0.097656, 0.066406]
      ];

      const scale = 0.046;
      const shape = new THREE.Shape();
      let curX = relCommands[0][0];
      let curY = relCommands[0][1];

      shape.moveTo((curX - 50) * scale, -(curY - 50) * scale);

      for (let i = 1; i < relCommands.length; i++) {
        curX += relCommands[i][0];
        curY += relCommands[i][1];
        shape.lineTo((curX - 50) * scale, -(curY - 50) * scale);
      }

      shape.closePath();
      return shape;
    }

    const logoShape = createCleanAbyssLogoShape();

    const extrudeSettings = {
      steps: 1,
      depth: 0.12,
      bevelEnabled: true,
      bevelThickness: 0.18,
      bevelSize: 0.10,
      bevelSegments: 12,
      curveSegments: 24
    };

    const geometry = new THREE.ExtrudeGeometry(logoShape, extrudeSettings);
    geometry.center();
    geometry.computeVertexNormals();

    const logoGroup = new THREE.Group();
    scene.add(logoGroup);

    // =========================================================================
    // TRUE LIQUID MIRROR MERCURY SHADER
    // =========================================================================
    const customUniforms = {
      uTime: { value: 0.0 }
    };

    const liquidMercuryMat = new THREE.MeshStandardMaterial({
      color: 0xffffff,
      metalness: 1.0,
      roughness: 0.00,
      envMap: studioEnvMap,
      envMapIntensity: 2.8
    });

    liquidMercuryMat.onBeforeCompile = (shader) => {
      shader.uniforms.uTime = customUniforms.uTime;

      shader.vertexShader = `
        varying vec3 vWorldNormal;
        varying vec3 vWorldPos;
        ${shader.vertexShader}
      `;
      shader.vertexShader = shader.vertexShader.replace(
        '#include <worldpos_vertex>',
        `
        #include <worldpos_vertex>
        vWorldNormal = normalize(mat3(modelMatrix) * normal);
        vWorldPos = (modelMatrix * vec4(transformed, 1.0)).xyz;
        `
      );

      shader.fragmentShader = `
        uniform float uTime;
        varying vec3 vWorldNormal;
        varying vec3 vWorldPos;

        vec3 fastCelestialRainbow(float t) {
          return vec3(0.65) + vec3(0.35) * cos(6.28318 * (vec3(1.0) * t + vec3(0.00, 0.33, 0.67)));
        }
        ${shader.fragmentShader}
      `;

      shader.fragmentShader = shader.fragmentShader.replace(
        '#include <dithering_fragment>',
        `
        #include <dithering_fragment>

        // 1. Moving fluid wave for living iridescence
        vec2 waveCoord = vWorldPos.xy * 0.85 + vec2(uTime * 0.50, -uTime * 0.40);
        float fluidField = (sin(waveCoord.x) + cos(waveCoord.y) + sin(dot(vWorldPos.xy, vec2(0.6)) + uTime * 0.30)) * 0.333;
        vec3 iridColor = fastCelestialRainbow(fluidField * 2.0 + uTime * 0.12);

        // 2. Pure Mirror Reflection Fresnel
        vec3 viewDir = normalize(cameraPosition - vWorldPos);
        float fresnel = 1.0 - max(0.0, dot(viewDir, vWorldNormal));

        // 3. Subtle Living Chromatic Sheen Over 100% Mirror Chrome
        float iridBlend = (smoothstep(-0.2, 0.7, fluidField) * 0.16 + pow(fresnel, 1.6) * 0.24) * 0.55;
        gl_FragColor.rgb = mix(gl_FragColor.rgb, gl_FragColor.rgb * iridColor * 1.5, iridBlend);
        `
      );
    };

    const solidMesh = new THREE.Mesh(geometry, liquidMercuryMat);
    logoGroup.add(solidMesh);

    const wireMat = new THREE.MeshBasicMaterial({
      color: 0xffffff,
      wireframe: true,
      transparent: true,
      opacity: 0.35,
      visible: false
    });
    const wireMesh = new THREE.Mesh(geometry, wireMat);
    logoGroup.add(wireMesh);

    document.getElementById('btn-front').addEventListener('click', () => {
      controls.reset();
      camera.position.set(0, 0, 10);
    });

    document.getElementById('btn-side').addEventListener('click', () => {
      controls.reset();
      camera.position.set(10, 0, 0);
    });

    document.getElementById('btn-persp').addEventListener('click', () => {
      controls.reset();
      camera.position.set(5, 3.0, 8.0);
    });

    let wireVisible = false;
    document.getElementById('btn-wire').addEventListener('click', () => {
      wireVisible = !wireVisible;
      wireMesh.visible = wireVisible;
    });

    let autoSpin = true;
    document.getElementById('btn-spin').addEventListener('click', () => {
      autoSpin = !autoSpin;
    });

    let lastT = performance.now();

    function animate(now) {
      requestAnimationFrame(animate);
      const delta = (now - lastT) * 0.001;
      lastT = now;
      const t = now * 0.001;

      if (autoSpin) {
        logoGroup.rotation.y += delta * 0.12;
        logoGroup.rotation.x = Math.sin(t * 0.4) * 0.12;
      }

      customUniforms.uTime.value = t;

      controls.update();
      renderer.render(scene, camera);
    }
    requestAnimationFrame(animate);

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
